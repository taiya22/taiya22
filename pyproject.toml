[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taiga-sim"
version = "0.1.0"
description = "Taiga Capital Group 30-Year Business Simulation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.8.0",
    "mypy>=1.13",
    "pandas-stubs>=2.0",
]

[tool.setuptools.packages.find]
include = ["taiga_sim*"]

# --- Harness: Quality Gate Configuration ---

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # bugbear (common bugs)
    "SIM",   # simplify
    "RUF",   # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "SIM102", # nested if is often more readable for domain logic
]

[tool.ruff.lint.isort]
known-first-party = ["taiga_sim"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
