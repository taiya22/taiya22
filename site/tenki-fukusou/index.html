<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4A90D9">
  <meta name="description" content="天気服装 - 今日一日の天気に合わせたコーディネートを自動提案">
  <title>天気服装 - 今日のコーデ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header__title">天気服装</div>
    <div class="header__actions">
      <button class="header__btn" id="refresh-btn" aria-label="更新">&#x1F504;</button>
    </div>
  </header>

  <!-- ===== Home Page ===== -->
  <main class="page active" id="page-home">
    <div id="weather-card" class="weather-card">
      <div style="text-align:center;padding:20px;opacity:0.7">読み込み中...</div>
    </div>
    <div id="outfit-container">
      <div style="text-align:center;padding:20px;color:var(--mid-gray)">コーディネートを生成中...</div>
    </div>
  </main>

  <!-- ===== Wardrobe Page ===== -->
  <main class="page" id="page-wardrobe">
    <div id="wardrobe-tabs" class="wardrobe-tabs"></div>
    <div id="wardrobe-grid" class="wardrobe-grid"></div>
  </main>

  <!-- ===== Settings Page ===== -->
  <main class="page" id="page-settings"></main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="bottom-nav__item active" data-page="home">
      <span class="bottom-nav__icon">&#x1F3E0;</span>
      <span>ホーム</span>
    </button>
    <button class="bottom-nav__item" data-page="wardrobe">
      <span class="bottom-nav__icon">&#x1F454;</span>
      <span>ワードローブ</span>
    </button>
    <button class="bottom-nav__item" data-page="settings">
      <span class="bottom-nav__icon">&#x2699;&#xFE0F;</span>
      <span>設定</span>
    </button>
  </nav>

  <!-- FAB (Wardrobe page) -->
  <button class="fab" id="fab" style="display:none" aria-label="服を追加">+</button>

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-content"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Scripts (order matters) -->
  <script src="js/mock-data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/wardrobe.js"></script>
  <script src="js/recommend.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
