<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ご縁 — Goen Management</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        'cosmos-bg': '#0a0a1a',
        'cosmos-surface': '#12122a',
        'cosmos-accent': '#6366f1',
        'cosmos-glow': '#818cf8',
        'cosmos-star': '#f0f0ff',
        'cosmos-dim': '#4a4a6a',
        'cosmos-warm': '#f59e0b',
      },
      fontFamily: {
        sans: ['Noto Sans JP', 'sans-serif'],
      },
    },
  },
}
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans JP', sans-serif; background: #0a0a1a; color: #f0f0ff; min-height: 100vh; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: #0a0a1a; }
  ::-webkit-scrollbar-thumb { background: #4a4a6a; border-radius: 2px; }
  .screen { display: none; }
  .screen.active { display: block; }
  .mood-inspired { border-left: 3px solid #f59e0b; }
  .mood-grateful { border-left: 3px solid #10b981; }
  .mood-energized { border-left: 3px solid #ef4444; }
  .mood-thoughtful { border-left: 3px solid #6366f1; }
  .mood-warm { border-left: 3px solid #ec4899; }
  .mood-neutral { border-left: 3px solid #4a4a6a; }
  .glow { text-shadow: 0 0 10px rgba(129,140,248,0.5); }
  .card-hover { transition: transform 0.2s, box-shadow 0.2s; }
  .card-hover:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(99,102,241,0.15); }
  @keyframes twinkle { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
  .star-bg { position: absolute; border-radius: 50%; background: #f0f0ff; }
  #universe-svg { width: 100%; height: 100%; }
  #universe-container { overflow: hidden; touch-action: none; }
  .tooltip-universe {
    position: fixed; background: #12122a; border: 1px solid #6366f1; border-radius: 8px;
    padding: 10px 14px; font-size: 12px; pointer-events: none; opacity: 0;
    transition: opacity 0.2s; z-index: 50; max-width: 220px;
  }
  .community-hull { fill-opacity: 0.04; stroke-opacity: 0.12; stroke-width: 1.5; }
  .self-node { filter: drop-shadow(0 0 12px #818cf8) drop-shadow(0 0 24px rgba(99,102,241,0.4)); }
  .self-ring { animation: pulse-ring 2.5s ease-in-out infinite; }
  @keyframes pulse-ring { 0%,100% { opacity: 0.15; r: 22; } 50% { opacity: 0.35; r: 28; } }
  .brightness-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .brightness-white { background: #f0f0ff; box-shadow: 0 0 6px #f0f0ff; }
  .brightness-indigo { background: #6366f1; box-shadow: 0 0 6px #6366f1; }
  .brightness-deep { background: #3730a3; box-shadow: 0 0 4px #3730a3; }
  .brightness-dim { background: #4a4a6a; }

  /* 流れ星（彗星）*/
  .comet-container {
    position: absolute; z-index: 25; pointer-events: none;
  }
  .comet-container.orbiting { pointer-events: auto; cursor: pointer; }
  .comet-head {
    width: 6px; height: 6px; border-radius: 50%; background: #fbbf24;
    box-shadow: 0 0 8px 3px rgba(251,191,36,0.7), 0 0 20px 6px rgba(245,158,11,0.3);
    position: absolute; top: 0; left: 0;
  }
  .comet-tail {
    position: absolute; height: 2px; border-radius: 1px; top: 2px;
    background: linear-gradient(to left, rgba(251,191,36,0.8), rgba(245,158,11,0.2), transparent);
    transform-origin: right center;
  }
  .comet-label {
    position: absolute; top: -18px; left: 10px; white-space: nowrap;
    font-size: 10px; color: #fbbf24; opacity: 0; transition: opacity 0.3s;
    text-shadow: 0 0 8px rgba(251,191,36,0.5);
  }
  .comet-container.orbiting .comet-label { opacity: 1; }

  /* 水紋エフェクト */
  .ripple-ring {
    position: absolute; border-radius: 50%; pointer-events: none;
    border: 1.5px solid; transform: translate(-50%, -50%);
    animation: ripple-expand 0.8s ease-out forwards;
  }
  @keyframes ripple-expand {
    0% { width: 0; height: 0; opacity: 0.8; }
    100% { width: 80px; height: 80px; opacity: 0; }
  }
  .ripple-ring:nth-child(2) { animation-delay: 0.15s; }
  .ripple-ring:nth-child(3) { animation-delay: 0.3s; }

  /* メディアスライダー */
  .media-slider { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; padding: 4px 0; scrollbar-width: none; }
  .media-slider::-webkit-scrollbar { display: none; }
  .media-card {
    flex: 0 0 auto; width: 100px; scroll-snap-align: center;
    border: 2px solid transparent; border-radius: 12px; padding: 12px 8px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    cursor: pointer; transition: all 0.25s; background: rgba(255,255,255,0.03);
  }
  .media-card.selected { border-color: #f59e0b; background: rgba(245,158,11,0.08); }
  .media-card .media-icon { font-size: 24px; }
  .media-card .media-name { font-size: 11px; font-weight: 500; }

  /* ボトムシート */
  .bottom-sheet-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 60;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
  }
  .bottom-sheet-overlay.open { opacity: 1; pointer-events: auto; }
  .bottom-sheet {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%);
    width: 100%; max-width: 42rem; z-index: 61;
    background: #12122a; border-top: 1px solid #6366f1;
    border-radius: 16px 16px 0 0; padding: 20px 20px 32px;
    transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .bottom-sheet-overlay.open .bottom-sheet { transform: translateX(-50%) translateY(0); }
  .bottom-sheet-handle { width: 36px; height: 4px; background: #4a4a6a; border-radius: 2px; margin: 0 auto 16px; }
</style>
</head>
<body class="max-w-[42rem] mx-auto relative pb-20">

<!-- ===== ホーム画面 ===== -->
<div id="screen-home" class="screen px-4 pt-6">
  <header class="text-center mb-6">
    <h1 class="text-3xl font-bold glow tracking-wider">ご縁</h1>
    <p class="text-cosmos-dim text-sm mt-1">出会いを星のように記録する</p>
  </header>

  <!-- クイック入力 -->
  <div class="bg-cosmos-surface rounded-xl p-4 mb-6">
    <textarea id="encounter-input" rows="3" placeholder="出会いを記録... 例: 今日は田中さんと#起業 について話した。とても刺激的だった。"
      class="w-full bg-transparent text-cosmos-star placeholder-cosmos-dim text-sm resize-none outline-none"></textarea>
    <div id="extract-preview" class="text-xs text-cosmos-dim mt-2 min-h-[1.2em]"></div>
    <div class="flex items-center justify-between mt-3">
      <button id="btn-voice" onclick="startVoice()" class="text-cosmos-dim hover:text-cosmos-glow transition text-xl" title="音声入力">🎙️</button>
      <button id="btn-submit" onclick="submitEncounter()" class="bg-cosmos-accent hover:bg-indigo-500 text-white text-sm font-medium px-5 py-2 rounded-lg transition">記録する</button>
    </div>
  </div>

  <!-- 久しぶりのご縁 -->
  <div id="panel-stale" class="mb-6">
    <h2 class="text-sm font-medium text-cosmos-glow mb-3">✦ 久しぶりのご縁</h2>
    <div id="stale-list" class="space-y-2"></div>
  </div>

  <!-- 最近の記録 -->
  <div id="panel-recent" class="mb-6">
    <h2 class="text-sm font-medium text-cosmos-glow mb-3">✦ 最近の記録</h2>
    <div id="recent-list" class="space-y-2"></div>
  </div>
</div>

<!-- ===== ユニバース画面 ===== -->
<div id="screen-universe" class="screen active" style="padding:0;">
  <div id="universe-container" class="relative w-full" style="height:calc(100vh - 56px);">
    <svg id="universe-svg"></svg>
    <div id="universe-tooltip" class="tooltip-universe"></div>
    <div class="absolute top-4 left-4 pointer-events-none z-20 select-none">
      <div class="text-cosmos-star/[0.12] text-lg font-bold tracking-widest leading-none">ご縁</div>
      <div class="text-cosmos-star/[0.08] text-[9px] tracking-[0.2em] mt-0.5">GOEN MANAGEMENT</div>
    </div>
    <div class="absolute top-3 left-0 right-0 text-center pointer-events-none">
      <span class="text-xs font-medium glow opacity-40">スクロールして探索 · ダブルタップで中心に戻る</span>
    </div>
    <button id="btn-recenter" onclick="recenterSelf()" class="absolute bottom-4 right-4 bg-cosmos-surface/80 backdrop-blur-md border border-cosmos-dim/30 text-cosmos-glow text-xs px-3 py-2 rounded-full hover:bg-cosmos-accent/20 transition z-30">⊕ 中心に戻る</button>
  </div>
</div>

<!-- ===== リコネクト ボトムシート ===== -->
<div id="reconnect-overlay" class="bottom-sheet-overlay" onclick="closeReconnectSheet(event)">
  <div class="bottom-sheet" onclick="event.stopPropagation()">
    <div class="bottom-sheet-handle"></div>
    <div id="reconnect-sheet-content"></div>
  </div>
</div>

<!-- ===== ご縁一覧画面 ===== -->
<div id="screen-people" class="screen px-4 pt-6">
  <h2 class="text-center text-lg font-medium glow mb-4">ご縁一覧</h2>
  <div id="people-list" class="space-y-3"></div>
  <div id="people-empty" class="text-center text-cosmos-dim text-sm mt-12 hidden">まだ誰も記録されていません</div>
</div>

<!-- ===== 底部ナビゲーション ===== -->
<nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[42rem] bg-cosmos-surface/80 backdrop-blur-md border-t border-cosmos-dim/30 z-40">
  <div class="flex justify-around py-3">
    <button onclick="switchScreen('universe')" data-nav="universe" class="nav-btn flex flex-col items-center text-xs text-cosmos-accent">
      <span class="text-lg mb-0.5">✨</span>ユニバース
    </button>
    <button onclick="switchScreen('home')" data-nav="home" class="nav-btn flex flex-col items-center text-xs text-cosmos-dim">
      <span class="text-lg mb-0.5">🏠</span>記録
    </button>
    <button onclick="switchScreen('people')" data-nav="people" class="nav-btn flex flex-col items-center text-xs text-cosmos-dim">
      <span class="text-lg mb-0.5">👥</span>ご縁
    </button>
  </div>
</nav>

<script>
// ===== ストレージ =====
const STORAGE_KEY_PEOPLE = 'goen_people';
const STORAGE_KEY_ENCOUNTERS = 'goen_encounters';

function loadData(key) { try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; } }
function saveData(key, data) { localStorage.setItem(key, JSON.stringify(data)); }

let people = loadData(STORAGE_KEY_PEOPLE);
let encounters = loadData(STORAGE_KEY_ENCOUNTERS);

// ===== UUID =====
function uuid() { return 'xxxx-xxxx-4xxx'.replace(/[x]/g, () => (Math.random()*16|0).toString(16)) + '-' + Date.now().toString(36); }

// ===== AI抽出ロジック =====
const NAME_PATTERN = /(?:@(\S+)|(\S+?)(?:さん|くん|ちゃん|氏|先生|社長|部長|課長|代表))/g;

const TAG_KEYWORDS = {
  '起業': ['起業','スタートアップ','創業','ベンチャー','独立'],
  'キャリア': ['キャリア','転職','就職','仕事','働き方','昇進'],
  '海外': ['海外','留学','グローバル','渡航','外国','英語'],
  'テクノロジー': ['AI','テクノロジー','プログラミング','エンジニア','開発','DX','IT'],
  'クリエイティブ': ['デザイン','クリエイティブ','アート','写真','映像','音楽'],
  '投資': ['投資','資産','株','ファンド','M&A','IPO'],
  '学び': ['学び','勉強','読書','セミナー','研修','大学'],
  '食事': ['食事','ランチ','ディナー','飲み','カフェ','レストラン'],
  'イベント': ['イベント','交流会','セミナー','カンファレンス','パーティ','展示会'],
};

const MOOD_KEYWORDS = {
  inspired: ['刺激','感動','すごい','インスパイア','驚き','衝撃','圧倒'],
  grateful: ['感謝','ありがたい','おかげ','恩','助けて','救われ'],
  energized: ['元気','やる気','熱い','パワー','エネルギー','盛り上が'],
  thoughtful: ['考えさせ','深い','本質','哲学','気づき','視点'],
  warm: ['温かい','嬉しい','楽しい','笑','幸せ','心地よ','和やか'],
};

function extractNames(text) {
  const names = new Set();
  let m;
  const re = new RegExp(NAME_PATTERN.source, 'g');
  while ((m = re.exec(text)) !== null) {
    names.add(m[1] || m[2]);
  }
  return [...names];
}

function extractTags(text) {
  const tags = new Set();
  const hashRe = /#([\w\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF]+)/g;
  let m;
  while ((m = hashRe.exec(text)) !== null) tags.add(m[1]);
  for (const [tag, keywords] of Object.entries(TAG_KEYWORDS)) {
    for (const kw of keywords) {
      if (text.includes(kw)) { tags.add(tag); break; }
    }
  }
  return [...tags];
}

function detectMood(text) {
  for (const [mood, keywords] of Object.entries(MOOD_KEYWORDS)) {
    for (const kw of keywords) {
      if (text.includes(kw)) return mood;
    }
  }
  return 'neutral';
}

// ===== リアルタイムプレビュー =====
const inputEl = document.getElementById('encounter-input');
const previewEl = document.getElementById('extract-preview');
inputEl.addEventListener('input', () => {
  const text = inputEl.value;
  const names = extractNames(text);
  const tags = extractTags(text);
  const mood = detectMood(text);
  const parts = [];
  if (names.length) parts.push('👤 ' + names.join(', '));
  if (tags.length) parts.push('🏷️ ' + tags.join(', '));
  if (mood !== 'neutral') parts.push(moodIcon(mood) + ' ' + mood);
  previewEl.textContent = parts.join('　') || '';
});

function moodIcon(mood) {
  return { inspired:'💡', grateful:'🙏', energized:'🔥', thoughtful:'🤔', warm:'💖', neutral:'◽' }[mood] || '◽';
}

// ===== 音声入力 =====
function startVoice() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    alert('お使いのブラウザは音声入力に対応していません');
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = new SR();
  recognition.lang = 'ja-JP';
  recognition.interimResults = false;
  recognition.onresult = (e) => {
    inputEl.value += e.results[0][0].transcript;
    inputEl.dispatchEvent(new Event('input'));
  };
  recognition.onerror = () => {};
  recognition.start();
  document.getElementById('btn-voice').textContent = '🔴';
  recognition.onend = () => { document.getElementById('btn-voice').textContent = '🎙️'; };
}

// ===== エンカウンター送信 =====
function submitEncounter() {
  const text = inputEl.value.trim();
  if (!text) return;
  const names = extractNames(text);
  const tags = extractTags(text);
  const mood = detectMood(text);

  const personIds = [];
  const personNames = [];
  for (const name of names) {
    let person = people.find(p => p.name === name);
    if (!person) {
      person = { id: uuid(), name, createdAt: new Date().toISOString(), tags: [] };
      people.push(person);
    }
    // マージタグ
    for (const t of tags) { if (!person.tags.includes(t)) person.tags.push(t); }
    personIds.push(person.id);
    personNames.push(person.name);
  }

  const enc = {
    id: uuid(),
    text,
    personIds,
    personNames,
    tags,
    mood,
    createdAt: new Date().toISOString(),
  };
  encounters.push(enc);
  saveData(STORAGE_KEY_PEOPLE, people);
  saveData(STORAGE_KEY_ENCOUNTERS, encounters);

  inputEl.value = '';
  previewEl.textContent = '';
  renderHome();
}

// ===== ホーム画面レンダリング =====
function renderHome() {
  renderStale();
  renderRecent();
}

function daysBetween(dateStr) {
  return Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
}

function renderStale() {
  const container = document.getElementById('stale-list');
  const staleData = [];
  for (const p of people) {
    const personEncs = encounters.filter(e => e.personIds.includes(p.id));
    if (!personEncs.length) continue;
    const last = personEncs.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt))[0];
    const days = daysBetween(last.createdAt);
    if (days < 30) continue;
    const freq = personEncs.length;
    const score = days * 0.7 + (1/freq) * 100;
    staleData.push({ person: p, last, days, score });
  }
  staleData.sort((a,b) => b.score - a.score);
  if (!staleData.length) {
    container.innerHTML = '<p class="text-xs text-cosmos-dim">すべてのご縁が活発です ✨</p>';
    return;
  }
  container.innerHTML = staleData.slice(0, 5).map(d => `
    <div class="bg-cosmos-surface rounded-lg p-3 card-hover">
      <div class="flex items-center justify-between">
        <span class="text-sm font-medium">${d.person.name}</span>
        <span class="text-xs text-cosmos-warm">${d.days}日前</span>
      </div>
      <p class="text-xs text-cosmos-dim mt-1 truncate">${d.last.text}</p>
      <span class="text-xs">${moodIcon(d.last.mood)}</span>
    </div>
  `).join('');
}

function renderRecent() {
  const container = document.getElementById('recent-list');
  const sorted = [...encounters].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 10);
  if (!sorted.length) {
    container.innerHTML = '<p class="text-xs text-cosmos-dim">まだ記録がありません</p>';
    return;
  }
  container.innerHTML = sorted.map(e => `
    <div class="bg-cosmos-surface rounded-lg p-3 mood-${e.mood} card-hover">
      <div class="flex items-center justify-between mb-1">
        <div class="flex gap-1 flex-wrap">${e.personNames.map(n => `<span class="text-xs bg-cosmos-accent/20 text-cosmos-glow px-2 py-0.5 rounded-full">${n}</span>`).join('')}</div>
        <span class="text-xs text-cosmos-dim">${formatDate(e.createdAt)}</span>
      </div>
      <p class="text-xs text-cosmos-star/80 leading-relaxed">${escapeHtml(e.text)}</p>
      <div class="flex gap-1 mt-1.5 flex-wrap">${e.tags.map(t => `<span class="text-[10px] text-cosmos-dim">#${t}</span>`).join(' ')}</div>
    </div>
  `).join('');
}

function formatDate(iso) {
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ===== ユニバース画面 =====
const SELF_ID = '__self__';
const SELF_NAME = '山脇';
let simulation = null;
let currentZoom = null;
let selfNode = null;

// コミュニティ色
const COMMUNITY_COLORS = {
  '起業': '#f59e0b',
  'テクノロジー': '#6366f1',
  '投資': '#10b981',
  'クリエイティブ': '#ec4899',
  'キャリア': '#8b5cf6',
  '海外': '#06b6d4',
  '食事': '#f97316',
  'イベント': '#ef4444',
  '学び': '#14b8a6',
};

function assignCommunity(tags) {
  // 最も代表的なタグをコミュニティとする
  const priority = ['起業','テクノロジー','投資','クリエイティブ','キャリア','海外','食事','イベント','学び'];
  for (const p of priority) { if (tags.includes(p)) return p; }
  return 'その他';
}

function recenterSelf() {
  if (!currentZoom) return;
  const container = document.getElementById('universe-container');
  const width = container.clientWidth;
  const height = container.clientHeight;
  const svg = d3.select('#universe-svg');
  // selfNodeは常に(0,0)なので、ビューポート中心を(0,0)に合わせる
  const t = d3.zoomIdentity.translate(width/2, height/2);
  svg.transition().duration(600).call(currentZoom.transform, t);
}

function renderUniverse() {
  const svg = d3.select('#universe-svg');
  svg.selectAll('*').remove();
  const container = document.getElementById('universe-container');
  const width = container.clientWidth;
  const height = container.clientHeight;
  svg.attr('width', width).attr('height', height);

  // ===== ノード構築 =====
  const nodes = [];
  const nodeMap = {};

  // 自分ノード — 原点(0,0)に完全固定
  const allSelfTags = [...new Set(encounters.flatMap(e => e.tags))];
  selfNode = { id: SELF_ID, name: SELF_NAME, count: encounters.length, days: 0, brightness: 1, r: 16, tags: allSelfTags, isSelf: true, community: 'self', fx: 0, fy: 0 };
  nodes.push(selfNode);
  nodeMap[SELF_ID] = selfNode;

  for (const p of people) {
    const encs = encounters.filter(e => e.personIds.includes(p.id));
    const count = encs.length;
    if (!count) continue;
    const lastEnc = [...encs].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt))[0];
    const days = daysBetween(lastEnc.createdAt);
    const brightness = Math.max(0, 1 - days / 120);
    const r = Math.min(10, 3 + count * 1.5);
    const allTags = [...new Set(encs.flatMap(e => e.tags))];
    const community = assignCommunity(allTags);
    const node = { id: p.id, name: p.name, count, days, brightness, r, tags: allTags, isSelf: false, community };
    nodes.push(node);
    nodeMap[p.id] = node;
  }

  // ===== リンク構築（自分↔各人 + 共起リンク） =====
  const links = [];
  const linkSet = new Set();

  for (const n of nodes) {
    if (n.isSelf) continue;
    links.push({ source: SELF_ID, target: n.id, isSelfLink: true });
    linkSet.add([SELF_ID, n.id].sort().join('-'));
  }

  for (const enc of encounters) {
    const ids = enc.personIds.filter(id => nodeMap[id]);
    for (let i = 0; i < ids.length; i++) {
      for (let j = i + 1; j < ids.length; j++) {
        const key = [ids[i], ids[j]].sort().join('-');
        if (!linkSet.has(key)) {
          linkSet.add(key);
          links.push({ source: ids[i], target: ids[j], isSelfLink: false });
        }
      }
    }
  }

  // ===== コミュニティグルーピング =====
  const communities = {};
  for (const n of nodes) {
    if (n.isSelf) continue;
    if (!communities[n.community]) communities[n.community] = [];
    communities[n.community].push(n);
  }

  // コミュニティ目標座標 — 原点(0,0)の周囲に放射状配置、遠めに
  const commKeys = Object.keys(communities);
  const commTargets = {};
  commKeys.forEach((key, i) => {
    const angle = (2 * Math.PI * i) / commKeys.length - Math.PI / 2;
    const dist = 350;
    commTargets[key] = { x: Math.cos(angle) * dist, y: Math.sin(angle) * dist };
  });

  // ===== フォースシミュレーション（銀河的：すぐ安定して動き回らない） =====
  if (simulation) simulation.stop();
  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id)
      .distance(d => d.isSelfLink ? 200 : 45)
      .strength(d => d.isSelfLink ? 0.06 : 0.6))
    .force('charge', d3.forceManyBody().strength(d => d.isSelf ? -500 : -40))
    .force('collision', d3.forceCollide().radius(d => d.r + 5))
    .force('community', () => {
      for (const n of nodes) {
        if (n.isSelf) continue;
        const target = commTargets[n.community];
        if (!target) continue;
        n.vx += (target.x - n.x) * 0.008;
        n.vy += (target.y - n.y) * 0.008;
      }
    })
    .alphaDecay(0.06)
    .velocityDecay(0.6);

  // ===== Zoom & Pan (ワールド座標系をビューポートに射影) =====
  const worldG = svg.append('g');

  currentZoom = d3.zoom()
    .scaleExtent([0.2, 4])
    .on('zoom', (event) => { worldG.attr('transform', event.transform); });
  svg.call(currentZoom);
  svg.on('dblclick.zoom', null);
  svg.on('dblclick', () => recenterSelf());

  // 初期ビューを原点中心に設定
  const initTransform = d3.zoomIdentity.translate(width / 2, height / 2);
  svg.call(currentZoom.transform, initTransform);

  // ===== 背景星（広範囲、ワールド座標系） =====
  const bgStars = worldG.append('g');
  for (let i = 0; i < 400; i++) {
    bgStars.append('circle')
      .attr('cx', (Math.random() - 0.5) * 3000)
      .attr('cy', (Math.random() - 0.5) * 3000)
      .attr('r', Math.random() * 1.0 + 0.2)
      .attr('fill', '#f0f0ff')
      .attr('opacity', Math.random() * 0.35 + 0.05);
  }

  // ===== コミュニティ背景 (convex hull) =====
  const hullG = worldG.append('g').attr('class', 'hulls');

  function updateHulls() {
    hullG.selectAll('path').remove();
    for (const [comm, members] of Object.entries(communities)) {
      if (members.length < 3) continue;
      const points = members.map(m => [m.x, m.y]);
      const hull = d3.polygonHull(points);
      if (!hull) continue;
      const color = COMMUNITY_COLORS[comm] || '#6366f1';
      const cx = d3.mean(hull, d => d[0]);
      const cy = d3.mean(hull, d => d[1]);
      const expanded = hull.map(([x, y]) => {
        const dx = x - cx, dy = y - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const scale = (dist + 40) / (dist || 1);
        return [cx + dx * scale, cy + dy * scale];
      });
      hullG.append('path')
        .attr('d', 'M' + expanded.join('L') + 'Z')
        .attr('class', 'community-hull')
        .attr('fill', color)
        .attr('stroke', color);
    }
  }

  // ===== リンク描画 =====
  const linkEls = worldG.append('g')
    .selectAll('line')
    .data(links)
    .join('line')
    .attr('stroke', d => d.isSelfLink ? '#818cf8' : '#6366f1')
    .attr('stroke-opacity', d => d.isSelfLink ? 0.1 : 0.22)
    .attr('stroke-width', d => d.isSelfLink ? 0.6 : 0.8);

  // ===== コミュニティラベル =====
  const labelG = worldG.append('g');
  const labelData = [];
  for (const [comm, members] of Object.entries(communities)) {
    if (members.length < 2) continue;
    labelData.push({ comm, members });
  }
  const labelEls = labelG.selectAll('text')
    .data(labelData)
    .join('text')
    .attr('fill', d => COMMUNITY_COLORS[d.comm] || '#f59e0b')
    .attr('font-size', '12px')
    .attr('text-anchor', 'middle')
    .attr('opacity', 0.45)
    .attr('font-weight', '500')
    .text(d => `⟡ ${d.comm}`);

  // ===== ノード描画 =====
  const nodeGroup = worldG.append('g')
    .selectAll('g')
    .data(nodes)
    .join('g')
    .call(d3.drag()
      .on('start', (event, d) => {
        if (d.isSelf) return; // 自分はドラッグ不可
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
      })
      .on('drag', (event, d) => {
        if (d.isSelf) return;
        d.fx = event.x; d.fy = event.y;
      })
      .on('end', (event, d) => {
        if (d.isSelf) return;
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null; d.fy = null;
      })
    );

  function starColor(b) {
    if (b > 0.6) return '#f0f0ff';
    if (b > 0.3) return '#6366f1';
    return '#4a4a6a';
  }

  // 自分ノード — パルスリング
  nodeGroup.filter(d => d.isSelf).append('circle')
    .attr('class', 'self-ring')
    .attr('r', 26)
    .attr('fill', 'none')
    .attr('stroke', '#818cf8')
    .attr('stroke-width', 1.5);

  // メイン円
  nodeGroup.append('circle')
    .attr('r', d => d.r)
    .attr('fill', d => d.isSelf ? '#c4b5fd' : starColor(d.brightness))
    .attr('opacity', d => d.isSelf ? 1 : 0.4 + d.brightness * 0.6)
    .attr('class', d => d.isSelf ? 'self-node' : '')
    .style('filter', d => {
      if (d.isSelf) return '';
      return d.brightness > 0.5 ? 'drop-shadow(0 0 4px #818cf8)' : 'none';
    });

  // 名前ラベル
  nodeGroup.append('text')
    .text(d => d.name)
    .attr('dy', d => d.r + 14)
    .attr('text-anchor', 'middle')
    .attr('fill', d => d.isSelf ? '#c4b5fd' : '#f0f0ff')
    .attr('font-size', d => d.isSelf ? '14px' : '10px')
    .attr('font-weight', d => d.isSelf ? '700' : '400')
    .attr('opacity', d => d.isSelf ? 1 : 0.7);

  // ===== 水紋エフェクト =====
  function spawnRipple(svgGroup, d) {
    const color = d.isSelf ? '#818cf8' : (COMMUNITY_COLORS[d.community] || '#6366f1');
    for (let i = 0; i < 3; i++) {
      const ring = svgGroup.append('circle')
        .attr('cx', d.x).attr('cy', d.y)
        .attr('r', d.r)
        .attr('fill', 'none')
        .attr('stroke', color)
        .attr('stroke-width', 1.5)
        .attr('opacity', 0.7);
      ring.transition()
        .delay(i * 150)
        .duration(800)
        .ease(d3.easeCubicOut)
        .attr('r', d.r + 40)
        .attr('opacity', 0)
        .remove();
    }
  }

  // ===== ツールチップ + 水紋タップ =====
  const tooltip = document.getElementById('universe-tooltip');
  nodeGroup.filter(d => !d.isSelf)
    .on('mouseenter', (event, d) => {
      tooltip.innerHTML = `<strong>${d.name}</strong><br>回数: ${d.count}<br>最終: ${d.days}日前<br>タグ: ${d.tags.join(', ') || 'なし'}<br>コミュニティ: ${d.community}`;
      tooltip.style.opacity = 1;
    })
    .on('mousemove', (event) => {
      tooltip.style.left = (event.clientX + 15) + 'px';
      tooltip.style.top = (event.clientY - 10) + 'px';
    })
    .on('mouseleave', () => { tooltip.style.opacity = 0; });

  // クリック/タップで水紋
  nodeGroup.on('click', (event, d) => {
    spawnRipple(worldG, d);
  });

  // タッチ対応
  nodeGroup.filter(d => !d.isSelf)
    .on('touchstart', (event, d) => {
      tooltip.innerHTML = `<strong>${d.name}</strong><br>回数: ${d.count} · ${d.days}日前<br>${d.tags.join(', ')}`;
      tooltip.style.opacity = 1;
      const touch = event.touches[0];
      tooltip.style.left = (touch.clientX + 10) + 'px';
      tooltip.style.top = (touch.clientY - 40) + 'px';
      setTimeout(() => { tooltip.style.opacity = 0; }, 2000);
    });

  // ===== Tick =====
  simulation.on('tick', () => {
    linkEls
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    nodeGroup.attr('transform', d => `translate(${d.x},${d.y})`);
    labelEls.each(function(d) {
      d3.select(this)
        .attr('x', d3.mean(d.members, m => m.x))
        .attr('y', d3.mean(d.members, m => m.y) - 25);
    });
    updateHulls();
  });
}

// ===== ご縁一覧画面 =====
function renderPeople() {
  const container = document.getElementById('people-list');
  const emptyEl = document.getElementById('people-empty');

  if (!people.length) {
    container.innerHTML = '';
    emptyEl.classList.remove('hidden');
    return;
  }
  emptyEl.classList.add('hidden');

  const enriched = people.map(p => {
    const encs = encounters.filter(e => e.personIds.includes(p.id));
    const count = encs.length;
    const sorted = [...encs].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    const lastEnc = sorted[0];
    const days = lastEnc ? daysBetween(lastEnc.createdAt) : 9999;
    const lastText = lastEnc ? lastEnc.text : '';
    return { ...p, count, days, lastText };
  }).sort((a,b) => a.days - b.days);

  function brightnessClass(days) {
    if (days <= 7) return 'brightness-white';
    if (days <= 30) return 'brightness-indigo';
    if (days <= 90) return 'brightness-deep';
    return 'brightness-dim';
  }

  container.innerHTML = enriched.map(p => `
    <div class="bg-cosmos-surface rounded-xl p-4 card-hover">
      <div class="flex items-center gap-3 mb-2">
        <span class="brightness-dot ${brightnessClass(p.days)}"></span>
        <span class="font-medium text-sm">${p.name}</span>
        <span class="text-xs text-cosmos-dim ml-auto">${p.count}回 · ${p.days === 9999 ? '—' : p.days + '日前'}</span>
      </div>
      <div class="flex gap-1 flex-wrap mb-2">${p.tags.slice(0, 5).map(t => `<span class="text-[10px] bg-cosmos-accent/15 text-cosmos-glow px-2 py-0.5 rounded-full">#${t}</span>`).join('')}</div>
      ${p.lastText ? `<p class="text-xs text-cosmos-dim truncate">${escapeHtml(p.lastText)}</p>` : ''}
    </div>
  `).join('');
}

// ===== 画面切り替え =====
function switchScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('text-cosmos-accent', b.dataset.nav === name);
    b.classList.toggle('text-cosmos-dim', b.dataset.nav !== name);
  });
  if (name === 'universe') { renderUniverse(); startShootingStarCycle(); }
  else { stopShootingStarCycle(); }
  if (name === 'people') renderPeople();
  if (name === 'home') renderHome();
}

let reconnectQueue = [];
let reconnectCurrent = null;
let shootingStarTimer = null;
let activeComets = []; // 周回中の彗星DOM

function getStalePersons() {
  const stale = [];
  for (const p of people) {
    const encs = encounters.filter(e => e.personIds.includes(p.id));
    if (!encs.length) continue;
    const last = [...encs].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt))[0];
    const days = daysBetween(last.createdAt);
    if (days >= 30) {
      const freq = encs.length;
      const score = days * 0.7 + (1/freq) * 100;
      stale.push({ person: p, lastEnc: last, days, score });
    }
  }
  return stale.sort((a,b) => b.score - a.score);
}

function clearActiveComets() {
  for (const c of activeComets) {
    if (c.raf) cancelAnimationFrame(c.raf);
    if (c.el && c.el.parentNode) c.el.remove();
  }
  activeComets = [];
}

function launchComet(personData) {
  const container = document.getElementById('universe-container');
  if (!container) return;
  const w = container.clientWidth;
  const h = container.clientHeight;
  const centerX = w / 2;
  const centerY = h / 2;

  // 画面端のランダム出発点
  const side = Math.floor(Math.random() * 4);
  let startX, startY;
  if (side === 0) { startX = -30; startY = Math.random() * h * 0.6; }
  else if (side === 1) { startX = w + 30; startY = Math.random() * h * 0.6; }
  else if (side === 2) { startX = Math.random() * w; startY = -30; }
  else { startX = w * 0.2 + Math.random() * w * 0.6; startY = -30; }

  // 彗星DOM
  const comet = document.createElement('div');
  comet.className = 'comet-container';

  const head = document.createElement('div');
  head.className = 'comet-head';
  comet.appendChild(head);

  const tail = document.createElement('div');
  tail.className = 'comet-tail';
  tail.style.width = '0px';
  comet.appendChild(tail);

  const label = document.createElement('div');
  label.className = 'comet-label';
  label.textContent = `☄️ ${personData.person.name}  ${personData.days}日`;
  comet.appendChild(label);

  container.appendChild(comet);

  // ===== フェーズ1: 飛来（画面端→周回軌道近接点） =====
  // 楕円軌道パラメータ
  const orbitRX = 80 + Math.random() * 40; // 楕円の横半径
  const orbitRY = 50 + Math.random() * 30; // 楕円の縦半径
  const orbitSpeed = 0.0008 + Math.random() * 0.0004; // 周回速度
  const orbitStartAngle = Math.atan2(startY - centerY, startX - centerX);

  const approachDist = Math.sqrt((startX-centerX)**2 + (startY-centerY)**2);
  const approachDuration = 600 + approachDist * 0.4;

  // 接近先: 軌道上の最も近い点
  const arriveX = centerX + orbitRX * Math.cos(orbitStartAngle);
  const arriveY = centerY + orbitRY * Math.sin(orbitStartAngle);

  let phase = 'approach';
  let phaseStart = performance.now();
  let orbitAngle = orbitStartAngle;
  let alive = true;

  const cometState = { el: comet, raf: null };
  activeComets.push(cometState);

  // タップで開く
  comet.addEventListener('click', () => {
    reconnectCurrent = personData;
    openReconnectSheet();
  });
  comet.addEventListener('touchend', (e) => {
    e.preventDefault();
    reconnectCurrent = personData;
    openReconnectSheet();
  });

  function tick(now) {
    if (!alive) return;
    if (!comet.parentNode) { alive = false; return; }

    let cx, cy, angle;

    if (phase === 'approach') {
      const elapsed = now - phaseStart;
      const t = Math.min(1, elapsed / approachDuration);
      const eased = 1 - Math.pow(1 - t, 3);

      cx = startX + (arriveX - startX) * eased;
      cy = startY + (arriveY - startY) * eased;
      angle = Math.atan2(arriveY - startY, arriveX - startX);

      const tailLen = Math.min(50, approachDist * eased * 0.08);
      tail.style.width = tailLen + 'px';
      tail.style.left = (-tailLen) + 'px';
      tail.style.transform = `rotate(${angle + Math.PI}rad)`;

      if (t >= 1) {
        phase = 'orbit';
        phaseStart = now;
        comet.classList.add('orbiting');
      }
    } else if (phase === 'orbit') {
      const elapsed = now - phaseStart;
      orbitAngle = orbitStartAngle + elapsed * orbitSpeed;

      cx = centerX + orbitRX * Math.cos(orbitAngle);
      cy = centerY + orbitRY * Math.sin(orbitAngle);

      // テールの向き＝進行方向の逆
      const nextAngle = orbitAngle + 0.05;
      const nx = centerX + orbitRX * Math.cos(nextAngle);
      const ny = centerY + orbitRY * Math.sin(nextAngle);
      angle = Math.atan2(ny - cy, nx - cx);

      const tailLen = 35 + Math.sin(elapsed * 0.002) * 10;
      tail.style.width = tailLen + 'px';
      tail.style.left = (-tailLen) + 'px';
      tail.style.transform = `rotate(${angle + Math.PI}rad)`;

      // 頭の明滅
      const glow = 0.6 + Math.sin(elapsed * 0.003) * 0.4;
      head.style.opacity = glow;

      // 45秒周回したら離脱
      if (elapsed > 45000) {
        phase = 'depart';
        phaseStart = now;
        comet.classList.remove('orbiting');
      }
    } else if (phase === 'depart') {
      const elapsed = now - phaseStart;
      const t = Math.min(1, elapsed / 800);
      const eased = t * t;

      // 接線方向に飛び去る
      const departAngle = orbitAngle + Math.PI * 0.3;
      const departDist = 400 * eased;
      const baseX = centerX + orbitRX * Math.cos(orbitAngle);
      const baseY = centerY + orbitRY * Math.sin(orbitAngle);
      cx = baseX + Math.cos(departAngle) * departDist;
      cy = baseY + Math.sin(departAngle) * departDist;
      angle = departAngle;

      tail.style.width = (35 * (1-t)) + 'px';
      tail.style.left = (-(35*(1-t))) + 'px';
      tail.style.transform = `rotate(${angle + Math.PI}rad)`;
      comet.style.opacity = 1 - eased;

      if (t >= 1) {
        alive = false;
        comet.remove();
        activeComets = activeComets.filter(c => c !== cometState);
        return;
      }
    }

    comet.style.left = cx + 'px';
    comet.style.top = cy + 'px';

    cometState.raf = requestAnimationFrame(tick);
  }

  cometState.raf = requestAnimationFrame(tick);
}

// DM自動生成テンプレート
function generateDMText(d) {
  const greetings = [
    `${d.person.name}さん、お久しぶりです！`,
    `${d.person.name}さん、ご無沙汰しております！`,
    `${d.person.name}さん！お元気ですか？`,
  ];
  const bodies = [];
  if (d.days > 90) bodies.push(`もう${d.days}日も経ってしまいました。`);
  else if (d.days > 60) bodies.push(`気づけば${d.days}日ぶりですね。`);
  else bodies.push(`前回お会いしてから${d.days}日経ちましたね。`);

  // 前回の話題に触れる
  const tagRef = d.person.tags[0];
  const topicMap = {
    '起業': 'その後、事業の方はいかがですか？',
    'テクノロジー': 'テック周りで最近面白い話はありますか？',
    '投資': '投資の方、最近どうですか？',
    'クリエイティブ': '最近のクリエイティブ活動はどうですか？',
    'キャリア': 'お仕事の方は順調ですか？',
    '海外': '海外の方はいかがですか？',
    '食事': 'また一緒にご飯行きませんか？',
    'イベント': 'また何かイベントで一緒できたら嬉しいです！',
    '学び': '最近何か面白い学びはありましたか？',
  };
  const topic = topicMap[tagRef] || 'ぜひまたお話しましょう！';

  const greeting = greetings[Math.floor(Math.random() * greetings.length)];
  return `${greeting}\n${bodies[0]}\n${topic}`;
}

        <span class="media-name" style="color:#f0f0ff">X (DM)</span>
      </div>
      <div class="media-card" data-media="sms" onclick="selectMedia('sms')">
        <span class="media-icon">📱</span>
        <span class="media-name" style="color:#34d399">SMS</span>
      </div>
    </div>

    <button onclick="executeReconnect('${d.person.id}')"
      class="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-cosmos-bg text-sm font-bold py-3.5 rounded-xl transition shadow-lg shadow-amber-900/30 active:scale-[0.98]">
      ☄️ リコネクトする
    </button>
  `;
  document.getElementById('reconnect-overlay').classList.add('open');
}

function selectMedia(media) {
  selectedMedia = media;
  document.querySelectorAll('#media-slider .media-card').forEach(c => {
    c.classList.toggle('selected', c.dataset.media === media);
  });
}

function closeReconnectSheet(event) {
  if (event && event.target && event.target !== event.currentTarget) return;
  document.getElementById('reconnect-overlay').classList.remove('open');
}

function executeReconnect(personId) {
  const d = reconnectCurrent;
  if (!d) return;
  const dmText = document.getElementById('dm-preview').textContent;
  const encoded = encodeURIComponent(dmText);
  const subj = encodeURIComponent(`${d.person.name}さんへ`);

  // メディア別にリンクを開く
  const urls = {
    line: `https://line.me/R/oaMessage/?${encoded}`,
    messenger: `https://www.messenger.com/new?text=${encoded}`,
    email: `mailto:?subject=${subj}&body=${encoded}`,
    x: `https://twitter.com/messages/compose?text=${encoded}`,
    sms: `sms:?body=${encoded}`,
  };
  const url = urls[selectedMedia];
  if (url) window.open(url, '_blank');

  // エンカウンター自動記録
  const person = people.find(p => p.id === personId);
  if (!person) return;

  const autoText = `${person.name}さんにリコネクト（${selectedMedia.toUpperCase()}）。${d.days}日ぶりの連絡。`;
  const tags = [...person.tags.slice(0, 2)];
  for (const t of tags) { if (!person.tags.includes(t)) person.tags.push(t); }

  const enc = {
    id: uuid(),
    text: autoText,
    personIds: [personId],
    personNames: [person.name],
    tags,
    mood: 'warm',
    createdAt: new Date().toISOString(),
  };
  encounters.push(enc);
  saveData(STORAGE_KEY_PEOPLE, people);
  saveData(STORAGE_KEY_ENCOUNTERS, encounters);

  closeReconnectSheet();
  clearActiveComets();
  renderUniverse();
  startShootingStarCycle();
}

function startShootingStarCycle() {
  if (shootingStarTimer) clearTimeout(shootingStarTimer);
  reconnectQueue = getStalePersons();
  if (!reconnectQueue.length) return;

  let index = 0;
  function scheduleNext() {
    if (!document.getElementById('screen-universe').classList.contains('active')) return;
    if (reconnectQueue.length > 0 && activeComets.length < 2) {
      const item = reconnectQueue[index % reconnectQueue.length];
      index++;
      launchComet(item);
    }
    const delay = 18000 + Math.random() * 12000;
    shootingStarTimer = setTimeout(scheduleNext, delay);
  }
  shootingStarTimer = setTimeout(scheduleNext, 3000);
}

function stopShootingStarCycle() {
  if (shootingStarTimer) { clearTimeout(shootingStarTimer); shootingStarTimer = null; }
  clearActiveComets();
}

// ===== 初期化 =====
seedDemoData();
renderUniverse();
startShootingStarCycle();
</script>
</body>
</html>
