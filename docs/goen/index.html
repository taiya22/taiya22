        'cosmos-accent': '#6366f1',

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans JP', sans-serif; background: #0a0a1a; color: #f0f0ff; min-height: 100vh; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: #0a0a1a; }
  ::-webkit-scrollbar-thumb { background: #4a4a6a; border-radius: 2px; }
  .screen { display: none; }
  .screen.active { display: block; }
  .mood-inspired { border-left: 3px solid #f59e0b; }
  .mood-grateful { border-left: 3px solid #10b981; }
  .mood-energized { border-left: 3px solid #ef4444; }
  .mood-thoughtful { border-left: 3px solid #6366f1; }
  .mood-warm { border-left: 3px solid #ec4899; }
  .mood-neutral { border-left: 3px solid #4a4a6a; }
  .glow { text-shadow: 0 0 10px rgba(129,140,248,0.5); }
  .card-hover { transition: transform 0.2s, box-shadow 0.2s; }
  .card-hover:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(99,102,241,0.15); }
  @keyframes twinkle { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
  .star-bg { position: absolute; border-radius: 50%; background: #f0f0ff; }
  #universe-svg { width: 100%; height: 100%; }
  #universe-container { overflow: hidden; touch-action: none; }
  .tooltip-universe {
    position: fixed; background: #12122a; border: 1px solid #6366f1; border-radius: 8px;
    padding: 10px 14px; font-size: 12px; pointer-events: none; opacity: 0;
    transition: opacity 0.2s; z-index: 50; max-width: 220px;
  }
  .community-hull { fill-opacity: 0.04; stroke-opacity: 0.12; stroke-width: 1.5; }
  .self-node { filter: drop-shadow(0 0 12px #818cf8) drop-shadow(0 0 24px rgba(99,102,241,0.4)); }
  .self-ring { animation: pulse-ring 2.5s ease-in-out infinite; }
  @keyframes pulse-ring { 0%,100% { opacity: 0.15; r: 22; } 50% { opacity: 0.35; r: 28; } }
  .brightness-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .brightness-white { background: #f0f0ff; box-shadow: 0 0 6px #f0f0ff; }
  .brightness-indigo { background: #6366f1; box-shadow: 0 0 6px #6366f1; }
  .brightness-deep { background: #3730a3; box-shadow: 0 0 4px #3730a3; }
  .brightness-dim { background: #4a4a6a; }

  /* 流れ星（彗星）*/
  .comet-container {
    position: absolute; z-index: 25; pointer-events: none;
  }
  .comet-container.orbiting { pointer-events: auto; cursor: pointer; }
  .comet-head {
    width: 6px; height: 6px; border-radius: 50%; background: #fbbf24;
    box-shadow: 0 0 8px 3px rgba(251,191,36,0.7), 0 0 20px 6px rgba(245,158,11,0.3);
    position: absolute; top: 0; left: 0;
  }
  .comet-tail {
    position: absolute; height: 2px; border-radius: 1px; top: 2px;
    background: linear-gradient(to left, rgba(251,191,36,0.8), rgba(245,158,11,0.2), transparent);
    transform-origin: right center;
  }
  .comet-label {
    position: absolute; top: -18px; left: 10px; white-space: nowrap;

    animation: ripple-expand 0.8s ease-out forwards;

  /* メディアスライダー */

<script>
// ===== CryptoService (AES-GCM + PBKDF2) =====
const CryptoService = {
  SALT_KEY: 'goen_salt',
  VERIFY_KEY: 'goen_verify',
  DATA_KEY: 'goen_vault',

  async deriveKey(passphrase, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['encrypt', 'decrypt']
    );
  },

  async setup(passphrase) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    localStorage.setItem(this.SALT_KEY, btoa(String.fromCharCode(...salt)));
    const key = await this.deriveKey(passphrase, salt);
    // 検証用トークンを暗号化して保存
    const verify = await this.encrypt(key, '__goen_ok__');
    localStorage.setItem(this.VERIFY_KEY, verify);
    return key;
  },

  async unlock(passphrase) {
    const saltB64 = localStorage.getItem(this.SALT_KEY);
    if (!saltB64) return null;
    const salt = Uint8Array.from(atob(saltB64), c => c.charCodeAt(0));
    const key = await this.deriveKey(passphrase, salt);
    try {
      const result = await this.decrypt(key, localStorage.getItem(this.VERIFY_KEY));
      return result === '__goen_ok__' ? key : null;
    } catch { return null; }
  },

  isSetup() { return !!localStorage.getItem(this.SALT_KEY); },

  async encrypt(key, plaintext) {
    const enc = new TextEncoder();
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(plaintext));
    const buf = new Uint8Array(iv.length + ct.byteLength);
    buf.set(iv);
    buf.set(new Uint8Array(ct), iv.length);
    return btoa(String.fromCharCode(...buf));
  },

  async decrypt(key, cipherB64) {
    const buf = Uint8Array.from(atob(cipherB64), c => c.charCodeAt(0));
    const iv = buf.slice(0, 12);
    const ct = buf.slice(12);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    return new TextDecoder().decode(pt);
  },

  async saveVault(key, data) {
    const json = JSON.stringify(data);
    const encrypted = await this.encrypt(key, json);
    localStorage.setItem(this.DATA_KEY, encrypted);
  },

  async loadVault(key) {
    const encrypted = localStorage.getItem(this.DATA_KEY);
    if (!encrypted) return null;
    try {
      const json = await this.decrypt(key, encrypted);
      return JSON.parse(json);
    } catch { return null; }
  },

  wipeAll() {
    localStorage.removeItem(this.SALT_KEY);
    localStorage.removeItem(this.VERIFY_KEY);
    localStorage.removeItem(this.DATA_KEY);
    localStorage.removeItem('goen_demo_version');
  }
};

// ===== AuthGate =====
let cryptoKey = null;
let autoLockTimer = null;
const AUTO_LOCK_MS = 5 * 60 * 1000; // 5分

function resetAutoLock() {
  if (autoLockTimer) clearTimeout(autoLockTimer);
  autoLockTimer = setTimeout(lockApp, AUTO_LOCK_MS);
}

function lockApp() {
  cryptoKey = null;
  document.getElementById('auth-gate').classList.remove('hidden');
  document.getElementById('auth-pass').value = '';
  document.getElementById('auth-error').textContent = '';
  // ロック時はログインモードに
  showLoginMode();
}

function showLoginMode() {
  document.getElementById('auth-subtitle').textContent = 'パスフレーズを入力';
  document.getElementById('auth-pass-confirm').style.display = 'none';
  document.getElementById('auth-btn').textContent = 'ロック解除';
  document.querySelector('[for-setup]')?.remove();
  const demoLabel = document.getElementById('auth-demo')?.parentElement;
  if (demoLabel) demoLabel.style.display = 'none';
}

async function handleAuth() {
  const pass = document.getElementById('auth-pass').value;
  const errEl = document.getElementById('auth-error');
  errEl.textContent = '';

  if (!pass || pass.length < 4) {
    errEl.textContent = '4文字以上のパスフレーズを入力してください';
    return;
  }

  if (CryptoService.isSetup()) {
    // ログイン
    const key = await CryptoService.unlock(pass);
    if (!key) { errEl.textContent = 'パスフレーズが違います'; return; }
    cryptoKey = key;
    await bootApp();
  } else {
    // 初回登録
    const confirm = document.getElementById('auth-pass-confirm').value;
    if (pass !== confirm) { errEl.textContent = 'パスフレーズが一致しません'; return; }
    cryptoKey = await CryptoService.setup(pass);
    const includeDemo = document.getElementById('auth-demo').checked;
    if (includeDemo) seedDemoData();
    await saveAllData();
    await bootApp();
  }
}

async function bootApp() {
  // 暗号化Vaultからデータ読み込み
  const vault = await CryptoService.loadVault(cryptoKey);
  if (vault) {
    people = vault.people || [];
    encounters = vault.encounters || [];
    reconnects = vault.reconnects || [];
  }
  document.getElementById('auth-gate').classList.add('hidden');
  renderUniverse();
  startShootingStarCycle();
  resetAutoLock();
}

// ===== UUID =====
function uuid() { return 'xxxx-xxxx-4xxx'.replace(/[x]/g, () => (Math.random()*16|0).toString(16)) + '-' + Date.now().toString(36); }

// ===== AI抽出ロジック =====
const NAME_PATTERN = /(?:@(\S+)|(\S+?)(?:さん|くん|ちゃん|氏|先生|社長|部長|課長|代表))/g;

const TAG_KEYWORDS = {
  '起業': ['起業','スタートアップ','創業','ベンチャー','独立'],
  'キャリア': ['キャリア','転職','就職','仕事','働き方','昇進'],
  '海外': ['海外','留学','グローバル','渡航','外国','英語'],
  'テクノロジー': ['AI','テクノロジー','プログラミング','エンジニア','開発','DX','IT'],
  'クリエイティブ': ['デザイン','クリエイティブ','アート','写真','映像','音楽'],
  '投資': ['投資','資産','株','ファンド','M&A','IPO'],
  '学び': ['学び','勉強','読書','セミナー','研修','大学'],
  '食事': ['食事','ランチ','ディナー','飲み','カフェ','レストラン'],
  'イベント': ['イベント','交流会','セミナー','カンファレンス','パーティ','展示会'],
};

const MOOD_KEYWORDS = {
  inspired: ['刺激','感動','すごい','インスパイア','驚き','衝撃','圧倒'],
  grateful: ['感謝','ありがたい','おかげ','恩','助けて','救われ'],
  energized: ['元気','やる気','熱い','パワー','エネルギー','盛り上が'],
  thoughtful: ['考えさせ','深い','本質','哲学','気づき','視点'],
  warm: ['温かい','嬉しい','楽しい','笑','幸せ','心地よ','和やか'],
};

function extractNames(text) {
  const names = new Set();
  let m;
  const re = new RegExp(NAME_PATTERN.source, 'g');
  while ((m = re.exec(text)) !== null) {
    names.add(m[1] || m[2]);
  }
  return [...names];
}

function extractTags(text) {
  const tags = new Set();
  const hashRe = /#([\w\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FFF]+)/g;
  let m;
  while ((m = hashRe.exec(text)) !== null) tags.add(m[1]);
  for (const [tag, keywords] of Object.entries(TAG_KEYWORDS)) {
    for (const kw of keywords) {
      if (text.includes(kw)) { tags.add(tag); break; }
    }
  }
  return [...tags];
}

function detectMood(text) {
  for (const [mood, keywords] of Object.entries(MOOD_KEYWORDS)) {
    for (const kw of keywords) {
      if (text.includes(kw)) return mood;
    }
  }
  return 'neutral';
}

// ===== リアルタイムプレビュー =====
const inputEl = document.getElementById('encounter-input');
const previewEl = document.getElementById('extract-preview');
inputEl.addEventListener('input', () => {
  const text = inputEl.value;
  const names = extractNames(text);
  const tags = extractTags(text);
  const mood = detectMood(text);
  const parts = [];
  if (names.length) parts.push('👤 ' + names.join(', '));
  if (tags.length) parts.push('🏷️ ' + tags.join(', '));
  if (mood !== 'neutral') parts.push(moodIcon(mood) + ' ' + mood);
  previewEl.textContent = parts.join('　') || '';
});

function moodIcon(mood) {
  return { inspired:'💡', grateful:'🙏', energized:'🔥', thoughtful:'🤔', warm:'💖', neutral:'◽' }[mood] || '◽';
}

// ===== 音声入力 =====
function startVoice() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    alert('お使いのブラウザは音声入力に対応していません');
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = new SR();
  recognition.lang = 'ja-JP';
  recognition.interimResults = false;
  recognition.onresult = (e) => {
    inputEl.value += e.results[0][0].transcript;
    inputEl.dispatchEvent(new Event('input'));
  };
  recognition.onerror = () => {};
  recognition.start();
  document.getElementById('btn-voice').textContent = '🔴';
  recognition.onend = () => { document.getElementById('btn-voice').textContent = '🎙️'; };
}

// ===== エンカウンター送信 =====
function submitEncounter() {
  const text = inputEl.value.trim();
  if (!text) return;
  const names = extractNames(text);
  const tags = extractTags(text);
  const mood = detectMood(text);

  const personIds = [];
  const personNames = [];
  for (const name of names) {
    let person = people.find(p => p.name === name);
    if (!person) {
      person = { id: uuid(), name, createdAt: new Date().toISOString(), tags: [] };
      people.push(person);
    }
    // マージタグ
    for (const t of tags) { if (!person.tags.includes(t)) person.tags.push(t); }
    personIds.push(person.id);
    personNames.push(person.name);
  }

  const enc = {
    id: uuid(),
    text,
    personIds,
    personNames,
    tags,
    mood,
    createdAt: new Date().toISOString(),
  };
  encounters.push(enc);
  saveAllData();

  inputEl.value = '';
  previewEl.textContent = '';
  renderHome();
}

// ===== ホーム画面レンダリング =====
function renderHome() {
  renderStale();
  renderRecent();
}

function daysBetween(dateStr) {
  return Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
}

function renderStale() {
  const container = document.getElementById('stale-list');
  const staleData = [];
  for (const p of people) {
    const personEncs = encounters.filter(e => e.personIds.includes(p.id));
    if (!personEncs.length) continue;
    const last = personEncs.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt))[0];
    const days = daysBetween(last.createdAt);
    if (days < 30) continue;
    const freq = personEncs.length;
    const score = days * 0.7 + (1/freq) * 100;
    staleData.push({ person: p, last, days, score });
  }
  staleData.sort((a,b) => b.score - a.score);
  if (!staleData.length) {
    container.innerHTML = '<p class="text-xs text-cosmos-dim">すべてのGoenが活発です ✨</p>';
    return;
  }
  container.innerHTML = staleData.slice(0, 5).map(d => `
    <div class="bg-cosmos-surface rounded-lg p-3 card-hover">
      <div class="flex items-center justify-between">
        <span class="text-sm font-medium">${d.person.name}</span>
        <span class="text-xs text-cosmos-warm">${d.days}日前</span>
      </div>
      <p class="text-xs text-cosmos-dim mt-1 truncate">${d.last.text}</p>
      <span class="text-xs">${moodIcon(d.last.mood)}</span>
    </div>
  `).join('');
}

function renderRecent() {
  const container = document.getElementById('recent-list');
  const sorted = [...encounters].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 10);
  if (!sorted.length) {
    container.innerHTML = '<p class="text-xs text-cosmos-dim">まだ記録がありません</p>';
    return;
  }
  container.innerHTML = sorted.map(e => `
    <div class="bg-cosmos-surface rounded-lg p-3 mood-${e.mood} card-hover">
      <div class="flex items-center justify-between mb-1">
        <div class="flex gap-1 flex-wrap">${e.personNames.map(n => `<span class="text-xs bg-cosmos-accent/20 text-cosmos-glow px-2 py-0.5 rounded-full">${n}</span>`).join('')}</div>
        <span class="text-xs text-cosmos-dim">${formatDate(e.createdAt)}</span>
      </div>
      <p class="text-xs text-cosmos-star/80 leading-relaxed">${escapeHtml(e.text)}</p>
      <div class="flex gap-1 mt-1.5 flex-wrap">${e.tags.map(t => `<span class="text-[10px] text-cosmos-dim">#${t}</span>`).join(' ')}</div>
    </div>
  `).join('');
}

function formatDate(iso) {
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ===== ユニバース画面 =====
const SELF_ID = '__self__';
const SELF_NAME = '山脇';
let simulation = null;
let currentZoom = null;
let selfNode = null;

// コミュニティ色
const COMMUNITY_COLORS = {
  '起業': '#f59e0b',
  'テクノロジー': '#6366f1',
  '投資': '#10b981',
  'クリエイティブ': '#ec4899',
  'キャリア': '#8b5cf6',
  '海外': '#06b6d4',
  '食事': '#f97316',
  'イベント': '#ef4444',
  '学び': '#14b8a6',
};

function assignCommunity(tags) {
  // 最も代表的なタグをコミュニティとする
  const priority = ['起業','テクノロジー','投資','クリエイティブ','キャリア','海外','食事','イベント','学び'];
  for (const p of priority) { if (tags.includes(p)) return p; }
  return 'その他';
}

function recenterSelf() {
  if (!currentZoom) return;
  const container = document.getElementById('universe-container');
  const width = container.clientWidth;
  const height = container.clientHeight;
  const svg = d3.select('#universe-svg');
  // selfNodeは常に(0,0)なので、ビューポート中心を(0,0)に合わせる
  const t = d3.zoomIdentity.translate(width/2, height/2);
  svg.transition().duration(600).call(currentZoom.transform, t);
}

function renderUniverse() {
  const svg = d3.select('#universe-svg');
  svg.selectAll('*').remove();
  const container = document.getElementById('universe-container');
  const width = container.clientWidth;
  const height = container.clientHeight;
  svg.attr('width', width).attr('height', height);

  // ===== ノード構築 =====
  const nodes = [];
  const nodeMap = {};

  // 自分ノード — 原点(0,0)に完全固定
  const allSelfTags = [...new Set(encounters.flatMap(e => e.tags))];
  selfNode = { id: SELF_ID, name: SELF_NAME, count: encounters.length, days: 0, brightness: 1, r: 16, tags: allSelfTags, isSelf: true, community: 'self', fx: 0, fy: 0 };
  nodes.push(selfNode);
  nodeMap[SELF_ID] = selfNode;

  for (const p of people) {
    const encs = encounters.filter(e => e.personIds.includes(p.id));
    const count = encs.length;
    if (!count) continue;
    const lastEnc = [...encs].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt))[0];
    const days = daysBetween(lastEnc.createdAt);
    const brightness = Math.max(0, 1 - days / 120);
    const r = Math.min(10, 3 + count * 1.5);
    const allTags = [...new Set(encs.flatMap(e => e.tags))];
    const community = assignCommunity(allTags);
    const node = { id: p.id, name: p.name, count, days, brightness, r, tags: allTags, isSelf: false, community };
    nodes.push(node);
    nodeMap[p.id] = node;
  }

  // ===== リンク構築（自分↔各人 + 共起リンク） =====
  const links = [];
  const linkSet = new Set();

  for (const n of nodes) {
    if (n.isSelf) continue;
    links.push({ source: SELF_ID, target: n.id, isSelfLink: true });
    linkSet.add([SELF_ID, n.id].sort().join('-'));
  }

  for (const enc of encounters) {
    const ids = enc.personIds.filter(id => nodeMap[id]);
    for (let i = 0; i < ids.length; i++) {
      for (let j = i + 1; j < ids.length; j++) {
        const key = [ids[i], ids[j]].sort().join('-');
        if (!linkSet.has(key)) {
          linkSet.add(key);
          links.push({ source: ids[i], target: ids[j], isSelfLink: false });
        }
      }
    }
  }

  // ===== コミュニティグルーピング =====
  const communities = {};
  for (const n of nodes) {
    if (n.isSelf) continue;
    if (!communities[n.community]) communities[n.community] = [];
    communities[n.community].push(n);
  }

  // ===== 固定レイアウト: コミュニティを多角形に配置 =====
  const commKeys = Object.keys(communities);
  const commCenters = {};
  const commRadius = 450;
  commKeys.forEach((key, i) => {
    const angle = (2 * Math.PI * i) / commKeys.length - Math.PI / 2;
    commCenters[key] = { x: Math.cos(angle) * commRadius, y: Math.sin(angle) * commRadius };
  });

  // 各コミュニティ内のノードもその中心の周囲に配置
  for (const [comm, members] of Object.entries(communities)) {
    const center = commCenters[comm];
    if (!center) continue;
    const memberRadius = 30 + members.length * 12;
    members.forEach((n, i) => {
      const a = (2 * Math.PI * i) / members.length;
      n.x = center.x + Math.cos(a) * memberRadius;
      n.y = center.y + Math.sin(a) * memberRadius;
    });
  }

  // ===== フォースシミュレーション（常時微動、決して止まらない） =====
  if (simulation) simulation.stop();
  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id)
      .distance(d => d.isSelfLink ? 350 : 40)
      .strength(d => d.isSelfLink ? 0.01 : 0.3))
    .force('charge', d3.forceManyBody().strength(d => d.isSelf ? -400 : -25))
    .force('collision', d3.forceCollide().radius(d => d.r + 6))
    .force('community', () => {
      for (const n of nodes) {
        if (n.isSelf) continue;
        const center = commCenters[n.community];
        if (!center) continue;
        n.vx += (center.x - n.x) * 0.003;
        n.vy += (center.y - n.y) * 0.003;
        // 常時微動: ランダムな微小力で平衡状態を破り続ける
        n.vx += (Math.random() - 0.5) * 0.15;
        n.vy += (Math.random() - 0.5) * 0.15;
      }
    })
    .alphaDecay(0)
    .velocityDecay(0.88)
    .alpha(0.1);

  // ===== Zoom & Pan (ワールド座標系をビューポートに射影) =====
  const worldG = svg.append('g');

  currentZoom = d3.zoom()
    .scaleExtent([0.2, 4])
    .on('zoom', (event) => { worldG.attr('transform', event.transform); });
  svg.call(currentZoom);
  svg.on('dblclick.zoom', null);
  svg.on('dblclick', () => recenterSelf());

  // 初期ビューを原点中心に設定
  const initTransform = d3.zoomIdentity.translate(width / 2, height / 2);
  svg.call(currentZoom.transform, initTransform);

  // ===== 背景星（広範囲、ワールド座標系） =====
  const bgStars = worldG.append('g');
  for (let i = 0; i < 400; i++) {
    bgStars.append('circle')
      .attr('cx', (Math.random() - 0.5) * 3000)
      .attr('cy', (Math.random() - 0.5) * 3000)
      .attr('r', Math.random() * 1.0 + 0.2)
      .attr('fill', '#f0f0ff')
      .attr('opacity', Math.random() * 0.35 + 0.05);
  }

  // ===== コミュニティ背景 (convex hull) =====
  const hullG = worldG.append('g').attr('class', 'hulls');

  function updateHulls() {
    hullG.selectAll('path').remove();
    for (const [comm, members] of Object.entries(communities)) {
      if (members.length < 3) continue;
      const points = members.map(m => [m.x, m.y]);
      const hull = d3.polygonHull(points);
      if (!hull) continue;
      const color = COMMUNITY_COLORS[comm] || '#6366f1';
      const cx = d3.mean(hull, d => d[0]);
      const cy = d3.mean(hull, d => d[1]);
      const expanded = hull.map(([x, y]) => {
        const dx = x - cx, dy = y - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const scale = (dist + 40) / (dist || 1);
        return [cx + dx * scale, cy + dy * scale];
      });
      hullG.append('path')
        .attr('d', 'M' + expanded.join('L') + 'Z')
        .attr('class', 'community-hull')
        .attr('fill', color)
        .attr('stroke', color);
    }
  }

  // ===== リンク描画 =====
  const linkEls = worldG.append('g')
    .selectAll('line')
    .data(links)
    .join('line')
    .attr('stroke', d => d.isSelfLink ? '#818cf8' : '#6366f1')
    .attr('stroke-opacity', d => d.isSelfLink ? 0.1 : 0.22)
    .attr('stroke-width', d => d.isSelfLink ? 0.6 : 0.8);

  // ===== コミュニティラベル =====
  const labelG = worldG.append('g');
  const labelData = [];
  for (const [comm, members] of Object.entries(communities)) {
    if (members.length < 2) continue;
    labelData.push({ comm, members });
  }
  const labelEls = labelG.selectAll('text')
    .data(labelData)
    .join('text')
    .attr('fill', d => COMMUNITY_COLORS[d.comm] || '#f59e0b')
    .attr('font-size', '12px')
    .attr('text-anchor', 'middle')
    .attr('opacity', 0.45)
    .attr('font-weight', '500')
    .text(d => `⟡ ${d.comm}`);

  // ===== ノード描画 =====
  const nodeGroup = worldG.append('g')
    .selectAll('g')
    .data(nodes)
    .join('g')
    .call(d3.drag()
      .on('start', (event, d) => {
        if (d.isSelf) return;
        d.fx = d.x; d.fy = d.y;
      })
      .on('drag', (event, d) => {
        if (d.isSelf) return;
        d.fx = event.x; d.fy = event.y;
      })
      .on('end', (event, d) => {
        if (d.isSelf) return;
        d.fx = null; d.fy = null;
      })
    );

  function starColor(b) {
    if (b > 0.6) return '#f0f0ff';
    if (b > 0.3) return '#6366f1';
    return '#4a4a6a';
  }

  // 自分ノード — パルスリング
  nodeGroup.filter(d => d.isSelf).append('circle')
    .attr('class', 'self-ring')
    .attr('r', 26)
    .attr('fill', 'none')
    .attr('stroke', '#818cf8')
    .attr('stroke-width', 1.5);

  // メイン円
  nodeGroup.append('circle')
    .attr('r', d => d.r)
    .attr('fill', d => d.isSelf ? '#c4b5fd' : starColor(d.brightness))
    .attr('opacity', d => d.isSelf ? 1 : 0.4 + d.brightness * 0.6)
    .attr('class', d => d.isSelf ? 'self-node' : '')
    .style('filter', d => {
      if (d.isSelf) return '';
      return d.brightness > 0.5 ? 'drop-shadow(0 0 4px #818cf8)' : 'none';
    });

  // 名前ラベル
  nodeGroup.append('text')
    .text(d => d.name)
    .attr('dy', d => d.r + 14)
    .attr('text-anchor', 'middle')
    .attr('fill', d => d.isSelf ? '#c4b5fd' : '#f0f0ff')
    .attr('font-size', d => d.isSelf ? '14px' : '10px')
    .attr('font-weight', d => d.isSelf ? '700' : '400')
    .attr('opacity', d => d.isSelf ? 1 : 0.7);

  // ===== 水紋エフェクト =====
  function spawnRipple(svgGroup, d) {
    const color = d.isSelf ? '#818cf8' : (COMMUNITY_COLORS[d.community] || '#6366f1');
    for (let i = 0; i < 3; i++) {
      const ring = svgGroup.append('circle')
        .attr('cx', d.x).attr('cy', d.y)
        .attr('r', d.r)
        .attr('fill', 'none')
        .attr('stroke', color)
        .attr('stroke-width', 1.5)
        .attr('opacity', 0.7);
      ring.transition()
        .delay(i * 150)
        .duration(800)
        .ease(d3.easeCubicOut)
        .attr('r', d.r + 40)
        .attr('opacity', 0)
        .remove();
    }
  }

  // ===== ツールチップ + 水紋タップ =====
  const tooltip = document.getElementById('universe-tooltip');
  nodeGroup.filter(d => !d.isSelf)
    .on('mouseenter', (event, d) => {
      tooltip.innerHTML = `<strong>${d.name}</strong><br>回数: ${d.count}<br>最終: ${d.days}日前<br>タグ: ${d.tags.join(', ') || 'なし'}<br>コミュニティ: ${d.community}`;
      tooltip.style.opacity = 1;
    })
    .on('mousemove', (event) => {
      tooltip.style.left = (event.clientX + 15) + 'px';
      tooltip.style.top = (event.clientY - 10) + 'px';
    })
    .on('mouseleave', () => { tooltip.style.opacity = 0; });

  // クリック/タップで水紋 + リコネクトシート
  nodeGroup.on('click', (event, d) => {
    spawnRipple(worldG, d);
    if (d.isSelf) return;
    // personデータを構築してリコネクトシートを開く
    const person = people.find(p => p.id === d.id);
    if (!person) return;
    const encs = encounters.filter(e => e.personIds.includes(d.id));
    if (!encs.length) return;
    const lastEnc = [...encs].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt))[0];
    reconnectCurrent = { person, lastEnc, days: d.days };
    tooltip.style.opacity = 0;
    openReconnectSheet();
  });

  // タッチ対応
  nodeGroup.filter(d => !d.isSelf)
    .on('touchstart', (event, d) => {
      tooltip.innerHTML = `<strong>${d.name}</strong><br>回数: ${d.count} · ${d.days}日前<br>${d.tags.join(', ')}`;
      tooltip.style.opacity = 1;
      const touch = event.touches[0];
      tooltip.style.left = (touch.clientX + 10) + 'px';
      tooltip.style.top = (touch.clientY - 40) + 'px';
      setTimeout(() => { tooltip.style.opacity = 0; }, 2000);
    });

  // ===== Tick =====
  simulation.on('tick', () => {
    linkEls
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    nodeGroup.attr('transform', d => `translate(${d.x},${d.y})`);
    labelEls.each(function(d) {
      d3.select(this)
        .attr('x', d3.mean(d.members, m => m.x))
        .attr('y', d3.mean(d.members, m => m.y) - 25);
    });
    updateHulls();
  });
}

function renderPeople() {
  const container = document.getElementById('people-list');
  const emptyEl = document.getElementById('people-empty');

  if (!people.length) {
    container.innerHTML = '';
    emptyEl.classList.remove('hidden');
    return;
  }
  emptyEl.classList.add('hidden');

  const enriched = people.map(p => {
    const encs = encounters.filter(e => e.personIds.includes(p.id));
    const count = encs.length;
    const sorted = [...encs].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    const lastEnc = sorted[0];
    const days = lastEnc ? daysBetween(lastEnc.createdAt) : 9999;
    const lastText = lastEnc ? lastEnc.text : '';
    return { ...p, count, days, lastText };
  }).sort((a,b) => a.days - b.days);

  function brightnessClass(days) {
    if (days <= 7) return 'brightness-white';
    if (days <= 30) return 'brightness-indigo';
    if (days <= 90) return 'brightness-deep';
    return 'brightness-dim';
  }

  container.innerHTML = enriched.map(p => `
    <div class="bg-cosmos-surface rounded-xl p-4 card-hover">
      <div class="flex items-center gap-3 mb-2">
        <span class="brightness-dot ${brightnessClass(p.days)}"></span>
        <span class="font-medium text-sm">${p.name}</span>
        <span class="text-xs text-cosmos-dim ml-auto">${p.count}回 · ${p.days === 9999 ? '—' : p.days + '日前'}</span>
      </div>
      <div class="flex gap-1 flex-wrap mb-2">${p.tags.slice(0, 5).map(t => `<span class="text-[10px] bg-cosmos-accent/15 text-cosmos-glow px-2 py-0.5 rounded-full">#${t}</span>`).join('')}</div>
      ${p.lastText ? `<p class="text-xs text-cosmos-dim truncate">${escapeHtml(p.lastText)}</p>` : ''}
    </div>
  `).join('');
}

function switchScreen(name) {

}

// ===== インポート機能 =====
let importedRows = [];
let importColMap = { name: -1, tags: -1, context: -1, lastDate: -1, memo: -1 };

const COL_CANDIDATES = {
  name: ['名前','name','氏名','人名','person','相手'],
  tags: ['タグ','tags','カテゴリ','category','分野'],
  context: ['関係性','context','メモ','備考','note','関係','どんな人'],
  lastDate: ['最終日','last_date','日付','date','最後に会った日','最終会話'],
  memo: ['記録','memo','出会いメモ','エピソード','encounter','内容'],
};

function autoMapColumns(headers) {
  const lower = headers.map(h => (h || '').toString().trim().toLowerCase());
  for (const [field, candidates] of Object.entries(COL_CANDIDATES)) {
    importColMap[field] = lower.findIndex(h => candidates.some(c => h.includes(c)));
  }
  // 名前が見つからない場合、最初の列をname扱い
  if (importColMap.name === -1) importColMap.name = 0;
}

function handleImportFile(file) {
  if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();

  if (ext === 'csv') {
    const reader = new FileReader();
    reader.onload = (e) => {
      const text = e.target.result;
      const lines = text.split(/\r?\n/).filter(l => l.trim());
      if (lines.length < 2) { alert('データが空です'); return; }
      const headers = lines[0].split(',').map(s => s.trim().replace(/^"|"$/g, ''));
      const rows = lines.slice(1).map(l => {
        // CSV parse (簡易: ダブルクォート対応)
        const cells = [];
        let current = '', inQuote = false;
        for (const ch of l) {
          if (ch === '"') { inQuote = !inQuote; }
          else if (ch === ',' && !inQuote) { cells.push(current.trim()); current = ''; }
          else { current += ch; }
        }
        cells.push(current.trim());
        return cells;
      });
      processImportData(headers, rows, file.name);
    };
    reader.readAsText(file, 'UTF-8');
  } else if (ext === 'xlsx' || ext === 'xls') {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
        if (data.length < 2) { alert('データが空です'); return; }
        const headers = data[0].map(h => (h || '').toString().trim());
        const rows = data.slice(1).filter(r => r.some(c => c));
        processImportData(headers, rows, file.name);
      } catch (err) { alert('ファイルの読み込みに失敗しました: ' + err.message); }
    };
    reader.readAsArrayBuffer(file);
  } else {
    alert('対応形式: .xlsx, .xls, .csv');
  }
}

function processImportData(headers, rows, fileName) {
  autoMapColumns(headers);
  importedRows = rows;

  document.getElementById('import-summary').textContent = `${fileName} — ${rows.length}件の人物データ`;

  // マッピングUI
  const mappingEl = document.getElementById('import-mapping');
  const fields = [
    { key: 'name', label: '名前', required: true },
    { key: 'tags', label: 'タグ' },
    { key: 'context', label: '関係性' },
    { key: 'lastDate', label: '最終日' },
    { key: 'memo', label: '記録メモ' },
  ];
  mappingEl.innerHTML = fields.map(f => {
    const options = headers.map((h, i) => `<option value="${i}" ${importColMap[f.key] === i ? 'selected' : ''}>${h}</option>`).join('');
    return `<div class="flex items-center gap-2">
      <span class="text-[10px] text-cosmos-dim w-14">${f.label}${f.required ? '*' : ''}</span>
      <select onchange="importColMap['${f.key}']=parseInt(this.value)" class="flex-1 bg-cosmos-bg/50 text-cosmos-star text-xs rounded px-2 py-1.5 border border-cosmos-dim/20 outline-none">
        <option value="-1">—</option>${options}
      </select>
    </div>`;
  }).join('');

  // サンプルプレビュー（最初の3行）
  const sampleEl = document.getElementById('import-sample');
  const preview = rows.slice(0, 3);
  sampleEl.innerHTML = preview.map(r => {
    const name = importColMap.name >= 0 ? (r[importColMap.name] || '—') : '—';
    const ctx = importColMap.context >= 0 ? (r[importColMap.context] || '') : '';
    return `<div class="text-xs text-cosmos-star/70 mb-1"><strong>${escapeHtml(String(name))}</strong> ${ctx ? '<span class="text-cosmos-dim">'+escapeHtml(String(ctx))+'</span>' : ''}</div>`;
  }).join('') + (rows.length > 3 ? `<div class="text-[10px] text-cosmos-dim">...他 ${rows.length - 3}件</div>` : '');

  document.getElementById('import-preview').classList.remove('hidden');
}

function cancelImport() {
  importedRows = [];
  document.getElementById('import-preview').classList.add('hidden');
  document.getElementById('import-file').value = '';
}

function executeImport() {
  if (!importedRows.length) return;
  if (importColMap.name === -1) { alert('「名前」列を選択してください'); return; }

  let imported = 0;
  for (const row of importedRows) {
    const name = (row[importColMap.name] || '').toString().trim();
    if (!name) continue;

    // 既存の人物と重複チェック
    let person = people.find(p => p.name === name);
    if (!person) {
      person = { id: uuid(), name, createdAt: new Date().toISOString(), tags: [], context: '' };
      people.push(person);
    }

    // タグ
    if (importColMap.tags >= 0) {
      const tagStr = (row[importColMap.tags] || '').toString();
      const tags = tagStr.split(/[,、\/\s]+/).map(t => t.replace('#', '').trim()).filter(Boolean);
      for (const t of tags) { if (!person.tags.includes(t)) person.tags.push(t); }
    }

    // コンテクスト
    if (importColMap.context >= 0) {
      const ctx = (row[importColMap.context] || '').toString().trim();
      if (ctx) person.context = ctx;
    }

    // 記録メモ → エンカウンターとして追加
    const memoText = importColMap.memo >= 0 ? (row[importColMap.memo] || '').toString().trim() : '';
    let encDate = new Date().toISOString();
    if (importColMap.lastDate >= 0) {
      const dateStr = (row[importColMap.lastDate] || '').toString().trim();
      if (dateStr) {
        const parsed = new Date(dateStr);
        if (!isNaN(parsed.getTime())) encDate = parsed.toISOString();
      }
    }

    if (memoText || importColMap.lastDate >= 0) {
      const enc = {
        id: uuid(),
        text: memoText || `${name}さんのデータをインポート`,
        personIds: [person.id],
        personNames: [name],
        tags: person.tags.slice(0, 3),
        mood: detectMood(memoText) || 'neutral',
        createdAt: encDate,
      };
      encounters.push(enc);
    }
    imported++;
  }

  saveAllData();
  cancelImport();
  renderHome();
  alert(`${imported}人のデータを取り込みました`);
}

let activeComets = []; // 周回中の彗星DOM

function getStalePersons() {
  const stale = [];
  for (const p of people) {
    const encs = encounters.filter(e => e.personIds.includes(p.id));
    if (!encs.length) continue;
    const last = [...encs].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt))[0];
    const days = daysBetween(last.createdAt);
    if (days >= 30) {
      const freq = encs.length;
      const score = days * 0.7 + (1/freq) * 100;
      stale.push({ person: p, lastEnc: last, days, score });
    }
  }
  return stale.sort((a,b) => b.score - a.score);
}

function clearActiveComets() {
  for (const c of activeComets) {
    if (c.raf) cancelAnimationFrame(c.raf);
    if (c.el && c.el.parentNode) c.el.remove();
  }
  activeComets = [];
}

function launchComet(personData) {
  const container = document.getElementById('universe-container');
  if (!container) return;
  const w = container.clientWidth;
  const h = container.clientHeight;
  const centerX = w / 2;
  const centerY = h / 2;

  // 画面端のランダム出発点
  const side = Math.floor(Math.random() * 4);
  let startX, startY;
  if (side === 0) { startX = -30; startY = Math.random() * h * 0.6; }
  else if (side === 1) { startX = w + 30; startY = Math.random() * h * 0.6; }
  else if (side === 2) { startX = Math.random() * w; startY = -30; }
  else { startX = w * 0.2 + Math.random() * w * 0.6; startY = -30; }

  // 彗星DOM
  const comet = document.createElement('div');
  comet.className = 'comet-container';

  const head = document.createElement('div');
  head.className = 'comet-head';
  comet.appendChild(head);

  const tail = document.createElement('div');
  tail.className = 'comet-tail';
  tail.style.width = '0px';
  comet.appendChild(tail);

  const label = document.createElement('div');
  label.className = 'comet-label';
  label.textContent = `☄️ ${personData.person.name}`;
  comet.appendChild(label);

  container.appendChild(comet);

  // ===== フェーズ1: 飛来（画面端→周回軌道近接点） =====
  // 楕円軌道パラメータ
  const orbitRX = 80 + Math.random() * 40; // 楕円の横半径
  const orbitRY = 50 + Math.random() * 30; // 楕円の縦半径
  const orbitSpeed = 0.0008 + Math.random() * 0.0004; // 周回速度
  const orbitStartAngle = Math.atan2(startY - centerY, startX - centerX);

  const approachDist = Math.sqrt((startX-centerX)**2 + (startY-centerY)**2);
  const approachDuration = 600 + approachDist * 0.4;

  // 接近先: 軌道上の最も近い点
  const arriveX = centerX + orbitRX * Math.cos(orbitStartAngle);
  const arriveY = centerY + orbitRY * Math.sin(orbitStartAngle);

  let phase = 'approach';
  let phaseStart = performance.now();
  let orbitAngle = orbitStartAngle;
  let alive = true;

  const cometState = { el: comet, raf: null };
  activeComets.push(cometState);

  // タップで開く
  comet.addEventListener('click', () => {
    reconnectCurrent = personData;
    openReconnectSheet();
  });
  comet.addEventListener('touchend', (e) => {
    e.preventDefault();
    reconnectCurrent = personData;
    openReconnectSheet();
  });

  function tick(now) {
    if (!alive) return;
    if (!comet.parentNode) { alive = false; return; }

    let cx, cy, angle;

    if (phase === 'approach') {
      const elapsed = now - phaseStart;
      const t = Math.min(1, elapsed / approachDuration);
      const eased = 1 - Math.pow(1 - t, 3);

      cx = startX + (arriveX - startX) * eased;
      cy = startY + (arriveY - startY) * eased;
      angle = Math.atan2(arriveY - startY, arriveX - startX);

      const tailLen = Math.min(50, approachDist * eased * 0.08);
      tail.style.width = tailLen + 'px';
      tail.style.left = (-tailLen) + 'px';
      tail.style.transform = `rotate(${angle + Math.PI}rad)`;

      if (t >= 1) {
        phase = 'orbit';
        phaseStart = now;
        comet.classList.add('orbiting');
      }
    } else if (phase === 'orbit') {
      const elapsed = now - phaseStart;
      orbitAngle = orbitStartAngle + elapsed * orbitSpeed;

      cx = centerX + orbitRX * Math.cos(orbitAngle);
      cy = centerY + orbitRY * Math.sin(orbitAngle);

      // テールの向き＝進行方向の逆
      const nextAngle = orbitAngle + 0.05;
      const nx = centerX + orbitRX * Math.cos(nextAngle);
      const ny = centerY + orbitRY * Math.sin(nextAngle);
      angle = Math.atan2(ny - cy, nx - cx);

      const tailLen = 35 + Math.sin(elapsed * 0.002) * 10;
      tail.style.width = tailLen + 'px';
      tail.style.left = (-tailLen) + 'px';
      tail.style.transform = `rotate(${angle + Math.PI}rad)`;

      // 頭の明滅
      const glow = 0.6 + Math.sin(elapsed * 0.003) * 0.4;
      head.style.opacity = glow;

      // 45秒周回したら離脱
      if (elapsed > 45000) {
        phase = 'depart';
        phaseStart = now;
        comet.classList.remove('orbiting');
      }
    } else if (phase === 'depart') {
      const elapsed = now - phaseStart;
      const t = Math.min(1, elapsed / 800);
      const eased = t * t;

      // 接線方向に飛び去る
      const departAngle = orbitAngle + Math.PI * 0.3;
      const departDist = 400 * eased;
      const baseX = centerX + orbitRX * Math.cos(orbitAngle);
      const baseY = centerY + orbitRY * Math.sin(orbitAngle);
      cx = baseX + Math.cos(departAngle) * departDist;
      cy = baseY + Math.sin(departAngle) * departDist;
      angle = departAngle;

      tail.style.width = (35 * (1-t)) + 'px';
      tail.style.left = (-(35*(1-t))) + 'px';
      tail.style.transform = `rotate(${angle + Math.PI}rad)`;
      comet.style.opacity = 1 - eased;

      if (t >= 1) {
        alive = false;
        comet.remove();
        activeComets = activeComets.filter(c => c !== cometState);
        return;
      }
    }

    comet.style.left = cx + 'px';
    comet.style.top = cy + 'px';

    cometState.raf = requestAnimationFrame(tick);
  }

  cometState.raf = requestAnimationFrame(tick);
}

      `${name}さん、前の作品の話がずっと頭に残ってて。次のやつも楽しみにしてるよ！`,

    'キャリア': [

    '海外': [
      `${name}さん！最近またどこか行った？`,

function regenerateMsg() {
  if (!reconnectCurrent) return;
  const newMsg = generateDMText(reconnectCurrent);
  const el = document.getElementById('reconnect-msg');
  if (el) el.value = newMsg;
}

function selectMedia(media) {
  selectedMedia = media;
  document.querySelectorAll('#media-slider .media-card').forEach(c => {
    c.classList.toggle('selected', c.dataset.media === media);
  });
  const label = document.getElementById('media-label');
  if (label) label.textContent = MEDIA_NAMES[media] || media;
}

function closeReconnectSheet(event) {
  if (event && event.target && event.target !== event.currentTarget) return;
  document.getElementById('reconnect-overlay').classList.remove('open');
}

let reconnects = [];

function executeReconnect(personId) {
  const d = reconnectCurrent;
  if (!d) return;
  const msgEl = document.getElementById('reconnect-msg');
  const msgText = msgEl ? msgEl.value.trim() : '';
  if (!msgText) { if (msgEl) msgEl.focus(); return; }

  const person = people.find(p => p.id === personId);
  if (!person) return;

  // リコネクト履歴に保存
  const rec = {
    id: uuid(),
    personId,
    personName: person.name,
    media: selectedMedia,
    message: msgText,
    daysSinceLast: d.days,
    createdAt: new Date().toISOString(),
  };
  reconnects.push(rec);
  saveAllData();

  // エンカウンターにも記録
  const enc = {
    id: uuid(),
    text: `${person.name}さんに${MEDIA_NAMES[selectedMedia]}でリコネクト`,
    personIds: [personId],
    personNames: [person.name],
    tags: person.tags.slice(0, 2),
    mood: 'warm',
    createdAt: new Date().toISOString(),
    isReconnect: true,
  };
  encounters.push(enc);
  saveAllData();

  // 送信完了フィードバック
  const btn = document.getElementById('btn-reconnect');
  const sheet = document.getElementById('reconnect-sheet-content');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '';
    btn.classList.remove('from-amber-500','to-orange-500','hover:from-amber-400','hover:to-orange-400');
    btn.classList.add('from-emerald-500','to-teal-500');
    btn.innerHTML = `<span class="inline-block animate-bounce">✓</span> ${person.name}さんに送信しました`;
  }
  // シート内を送信完了画面に
  setTimeout(() => {
    if (sheet) {
      sheet.innerHTML = `
        <div class="text-center py-6">
          <div class="text-4xl mb-3">☄️</div>
          <div class="text-lg font-bold text-cosmos-star mb-1">${person.name}さんにリコネクト！</div>
          <div class="text-xs text-cosmos-dim mb-1">${MEDIA_NAMES[selectedMedia]}で送信完了</div>
          <div class="text-xs text-cosmos-warm/70 mt-3 leading-relaxed max-w-[250px] mx-auto">"${msgText.length > 50 ? msgText.substring(0,50) + '...' : msgText}"</div>
          <div class="mt-5 text-[10px] text-cosmos-dim/40">MCP連携で実際に送信予定</div>
        </div>
      `;
    }
    setTimeout(() => {
      closeReconnectSheet();
      clearActiveComets();
      renderUniverse();
      startShootingStarCycle();
    }, 1500);
  }, 600);
}

// ===== リコネクト履歴画面 =====
function renderReconnectHistory() {
  const kpiEl = document.getElementById('reconnect-kpi');
  const chartEl = document.getElementById('reconnect-chart');
  const listEl = document.getElementById('reconnect-history-list');
  const emptyEl = document.getElementById('reconnect-history-empty');

  // KPI算出
  const now = Date.now();
  const day = 86400000;
  const thisMonth = reconnects.filter(r => now - new Date(r.createdAt).getTime() < 30 * day).length;
  const total = reconnects.length;
  const uniquePersons = new Set(reconnects.map(r => r.personId)).size;

  kpiEl.innerHTML = `
    <div class="bg-cosmos-surface rounded-xl p-3 text-center">
      <div class="text-2xl font-bold text-cosmos-warm">${thisMonth}</div>
      <div class="text-[10px] text-cosmos-dim mt-0.5">今月</div>
    </div>
    <div class="bg-cosmos-surface rounded-xl p-3 text-center">
      <div class="text-2xl font-bold text-cosmos-glow">${total}</div>
      <div class="text-[10px] text-cosmos-dim mt-0.5">累計</div>
    </div>
    <div class="bg-cosmos-surface rounded-xl p-3 text-center">
      <div class="text-2xl font-bold text-cosmos-star">${uniquePersons}</div>
      <div class="text-[10px] text-cosmos-dim mt-0.5">人数</div>
    </div>
  `;

  // 月別チャート（過去6ヶ月）
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date();
    d.setMonth(d.getMonth() - i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const label = `${d.getMonth()+1}月`;
    const count = reconnects.filter(r => {
      const rd = new Date(r.createdAt);
      return rd.getFullYear() === d.getFullYear() && rd.getMonth() === d.getMonth();
    }).length;
    months.push({ key, label, count });
  }
  const maxCount = Math.max(1, ...months.map(m => m.count));
  chartEl.innerHTML = months.map(m => {
    const h = Math.max(4, (m.count / maxCount) * 80);
    return `<div class="flex-1 flex flex-col items-center gap-1">
      <div class="text-[9px] text-cosmos-star/70 font-medium">${m.count}</div>
      <div class="w-full rounded-t" style="height:${h}px;background:linear-gradient(to top,#f59e0b,#f97316);opacity:${m.count ? 0.8 : 0.15}"></div>
      <div class="text-[9px] text-cosmos-dim">${m.label}</div>
    </div>`;
  }).join('');

  // 履歴一覧
  if (!reconnects.length) {
    listEl.innerHTML = '';
    emptyEl.classList.remove('hidden');
    return;
  }
  emptyEl.classList.add('hidden');
  const sorted = [...reconnects].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  listEl.innerHTML = sorted.map(r => `
    <div class="bg-cosmos-surface rounded-lg p-3 card-hover">
      <div class="flex items-center justify-between mb-1">
        <div class="flex items-center gap-2">
          <span class="text-xs">☄️</span>
          <span class="text-sm font-medium text-cosmos-star">${r.personName}</span>
          <span class="text-[10px] bg-cosmos-warm/15 text-cosmos-warm px-1.5 py-0.5 rounded">${MEDIA_NAMES[r.media] || r.media}</span>
        </div>
        <span class="text-[10px] text-cosmos-dim">${formatDate(r.createdAt)}</span>
      </div>
      <p class="text-xs text-cosmos-dim/70 truncate leading-relaxed">${escapeHtml(r.message)}</p>
    </div>
  `).join('');
}

function startShootingStarCycle() {
  if (shootingStarTimer) clearTimeout(shootingStarTimer);
  reconnectQueue = getStalePersons();
  if (!reconnectQueue.length) return;

  let index = 0;
  function scheduleNext() {
    if (!document.getElementById('screen-universe').classList.contains('active')) return;
    if (reconnectQueue.length > 0 && activeComets.length < 2) {
      const item = reconnectQueue[index % reconnectQueue.length];
      index++;
      launchComet(item);
    }
    const delay = 18000 + Math.random() * 12000;
    shootingStarTimer = setTimeout(scheduleNext, delay);
  }
  shootingStarTimer = setTimeout(scheduleNext, 3000);
}

function stopShootingStarCycle() {
  if (shootingStarTimer) { clearTimeout(shootingStarTimer); shootingStarTimer = null; }
  clearActiveComets();
}

// ===== データ消去 =====
function confirmWipe() {
  if (!confirm('全てのデータを完全に消去します。この操作は取り消せません。本当に消去しますか？')) return;
  if (!confirm('最終確認: パスフレーズ・人物データ・記録・リコネクト履歴が全て失われます。続行しますか？')) return;
  CryptoService.wipeAll();
  people = []; encounters = []; reconnects = [];
  cryptoKey = null;
  location.reload();
}
