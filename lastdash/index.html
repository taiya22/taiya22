<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>終電ダッシュ！</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --txt:#202124; --sub:#5f6368; --line:#e3e5e8; --teal:#00897b; --g-blue:#1a73e8;
    --ng:#d93025; --neon-bg:#fff3cd; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#fff;color:var(--txt);
    font-family:Roboto,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden}

  /* ===== 上部: 経路チップ要約 ===== */
  .topbar{flex:0 0 auto;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);z-index:5}
  .brand{font-weight:900;font-size:14px;padding:9px 16px 0}
  .brand b{color:var(--ng)}
  .chips{display:flex;align-items:center;gap:2px;overflow-x:auto;padding:10px 12px 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{display:inline-flex;align-items:center;gap:3px;flex:0 0 auto;font-size:14px;font-weight:500}
  .chip .seg{display:inline-flex;align-items:center;gap:4px;padding:3px 6px;border-radius:6px}
  .walkc{color:var(--sub)}
  .badge{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:3px 8px;color:#fff;font-weight:700;font-size:13px}
  .sq{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:5px;
    color:#fff;font-weight:700;font-size:10px;line-height:1.05;flex:0 0 auto;flex-direction:column}
  .arrow{color:#bdc1c6;font-size:13px;margin:0 1px}
  .close{margin-left:auto;flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:#f1f3f4;
    border:0;color:#5f6368;font-size:16px}

  /* ===== 終電ステータス帯 ===== */
  .status{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 16px;font-size:13px;font-weight:700}
  .status.ok{background:#e6f4ea;color:#188038}
  .status.warn{background:#fef7e0;color:#b06000}

  /* ===== タイムライン本体 ===== */
  .timeline{flex:1 1 auto;overflow-y:auto;padding:6px 0 4px}
  .node{position:relative;padding:0 16px 0 64px;min-height:30px}
  /* 左の縦ライン */
  .rail{position:absolute;left:34px;top:0;bottom:0;width:6px;border-radius:3px}
  .dots{position:absolute;left:33px;top:0;bottom:0;width:8px;display:flex;flex-direction:column;
    justify-content:space-evenly;align-items:center;padding:6px 0}
  .dots i{width:7px;height:7px;border-radius:50%;background:#dadce0;display:block}
  .stnicon{position:absolute;left:24px;width:28px;height:28px;border-radius:6px;background:#fff;
    border:2px solid var(--teal);display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:9px;font-weight:700;color:var(--teal);line-height:1}
  .pin{position:absolute;left:26px;width:26px;height:34px}

  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .stn{font-size:18px;font-weight:700;padding-top:1px}
  .time{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px}
  .time.sm{font-size:15px;font-weight:500}
  .meta{font-size:13px;color:var(--sub);margin-top:3px;line-height:1.5}
  .linerow{display:flex;align-items:center;gap:8px;margin:8px 0 2px}
  .sub2{color:var(--sub);font-size:13px}

  /* 徒歩レッグ */
  .walk{padding:14px 16px 14px 64px;position:relative;min-height:64px}
  .walk .wicon{position:absolute;left:24px;top:14px;width:26px;text-align:center;font-size:20px}
  .walk .wtxt{font-size:15px}
  .walk .wsub{font-size:12px;color:var(--sub);margin-top:2px}
  .chev{color:#bdc1c6;font-size:18px;align-self:center}

  /* ダッシュ判定バッジ（このアプリの核） */
  .dash{margin:8px 0 2px;display:inline-flex;align-items:center;gap:8px;background:#fce8e6;color:var(--ng);
    border-radius:9px;padding:7px 11px;font-size:13px;font-weight:700}
  .dash.ok{background:#e6f4ea;color:#188038}
  .dash .p{font-variant-numeric:tabular-nums}
  .ridebar{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:14px;padding:10px 0}
  .ridebar .cv{font-size:16px;color:#9aa7b4}

  .fare{display:flex;align-items:center;gap:10px;padding:16px;border-top:1px solid var(--line);font-size:15px}
  .fare .ic{background:#f1f3f4;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700;color:#5f6368;border:1px solid #dadce0}
  .fare b{font-weight:700}
  .cal{display:flex;align-items:center;gap:10px;padding:14px 16px;color:var(--g-blue);font-weight:500;font-size:15px;border-top:1px solid var(--line)}

  /* ===== 下部アクションバー ===== */
  .actions{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:#fff;box-shadow:0 -1px 4px rgba(0,0,0,.08)}
  .nav{display:flex;align-items:center;gap:7px;background:var(--ng);color:#fff;border:0;border-radius:24px;
    padding:13px 20px;font-size:16px;font-weight:700;flex:0 0 auto;box-shadow:0 2px 6px rgba(217,48,37,.35)}
  .act2{display:flex;align-items:center;gap:6px;background:#e8f0fe;color:#1967d2;border:0;border-radius:24px;
    padding:13px 14px;font-size:14px;font-weight:500;flex:0 0 auto}
  .total{margin-left:auto;text-align:right;line-height:1.15}
  .total .big{font-size:20px;font-weight:900}
  .total .arr{font-size:13px;color:var(--sub)}
  button{font-family:inherit;cursor:pointer}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">終電<b>ダッシュ！</b></div>
  <div class="chips" id="chips"></div>
</div>

<div class="status ok" id="status"></div>

<div class="timeline" id="timeline"></div>

<div class="actions">
  <button class="nav">🧭 ナビ開始</button>
  <button class="act2">🔖 保存</button>
  <div class="total"><div class="big" id="totDur"></div><div class="arr" id="totArr"></div></div>
</div>

<script>
/* ===== 路線カラー ===== */
const LINES={
  chuo:{code:'JC',name:'中央線',color:'#f15a22'},
  mono:{code:'TT',name:'多摩モノレール',color:'#00863c'},
};

/* ===== 経路データ（サンプル: 立川方面 → サンリオピューロランド）=====
   終電ダッシュ用に各「徒歩」レッグへ間に合う判定(prob/dash)を付与 */
const ITIN={
  totalDur:'1時間5分', arrive:'17:33', fare:'563',
  legs:[
    {type:'walk', dur:15, dist:'1.1km', from:'現在地', run:false, prob:100},
    {type:'board', line:'chuo', stn:'国分寺駅', code:'JC16', time:'16:38',
      dir:'東京方面・立川行', detail:'定刻出発予定 · 1番線 · 快速'},
    {type:'ride', stops:'3駅乗車', dur:7, color:'#f15a22'},
    {type:'alight', line:'chuo', stn:'立川駅', code:'JC19', time:'16:45', exit:'南口'},
    {type:'walk', dur:6, dist:'400m', from:'立川', to:'立川南', run:true, prob:78,
      note:'立川→立川南 乗換', limit:'16:59発に乗るには 16:55 までに到着'},
    {type:'board', line:'mono', stn:'立川南駅', code:'TT11', time:'16:59',
      dir:'多摩センター行', detail:'定刻出発予定 · 2番線 · 普通'},
    {type:'ride', stops:'10駅乗車', dur:22, color:'#00863c'},
    {type:'alight', line:'mono', stn:'多摩センター駅', code:'TT01', time:'17:21', exit:'出口4'},
    {type:'walk', dur:13, dist:'700m', from:'多摩センター', run:false, prob:100},
    {type:'dest', name:'サンリオピューロランド', addr:'〒206-8588 東京都多摩市落合1丁目31', time:'17:33'},
  ]
};

/* ===== 上部チップ ===== */
function renderChips(){
  const el=document.getElementById('chips');let h='';
  ITIN.legs.forEach((lg,i)=>{
    if(i)h+='<span class="arrow">›</span>';
    if(lg.type==='walk') h+=`<span class="chip walkc">🚶${lg.dur}${lg.run?'<span style="color:#d93025">🏃</span>':''}</span>`;
    else if(lg.type==='board'){const L=LINES[lg.line];
      h+=`<span class="badge" style="background:${L.color}"><span style="font-size:10px;border:1px solid rgba(255,255,255,.7);border-radius:3px;padding:0 3px">${L.code}</span>${L.name}</span>`;}
  });
  h+='<button class="close">✕</button>';
  el.innerHTML=h;
}

/* ===== ステータス帯 ===== */
function renderStatus(){
  const el=document.getElementById('status');
  const dash=ITIN.legs.find(l=>l.run);
  if(dash){el.className='status warn';
    el.innerHTML=`🏃 立川の乗換は徒歩${dash.dur}分・余裕4分。<span style="margin-left:4px">走れば間に合う（${dash.prob}%）</span>`;}
  else{el.className='status ok';el.innerHTML='✅ 全区間 余裕を持って到着できます';}
}

/* ===== タイムライン ===== */
function sq(code,color){const m=code.match(/^([A-Z]+)(\d+)$/);const a=m?m[1]:code,b=m?m[2]:'';
  return `<div class="sq" style="border:2px solid ${color};color:${color};background:#fff"><span>${a}</span><span>${b}</span></div>`;}

function renderTimeline(){
  const el=document.getElementById('timeline');let h='';
  ITIN.legs.forEach((lg,i)=>{
    if(lg.type==='walk'){
      h+=`<div class="walk">
        <div class="dots" style="left:33px">${'<i></i>'.repeat(4)}</div>
        <div class="wicon">🚶</div>
        <div class="row"><div>
          <div class="wtxt">徒歩で ${lg.dur}分 (${lg.dist})</div>
          ${lg.note?`<div class="wsub">${lg.note}</div>`:''}
          ${lg.run?`<div class="dash">🏃 ダッシュ区間！ <span class="p">間に合う確率 ${lg.prob}%</span></div>
            <div class="wsub" style="margin-top:6px">${lg.limit}</div>`:''}
        </div><span class="chev">›</span></div>
      </div>`;
    }
    else if(lg.type==='board'){const L=LINES[lg.line];
      h+=`<div class="node" style="padding-top:8px">
        <div class="rail" style="background:${L.color}"></div>
        ${sq(lg.code,L.color)}
        <div class="row"><div class="stn">${lg.stn}</div><div class="time">${lg.time}</div></div>
        <div class="linerow"><span class="badge" style="background:${L.color}">${L.code} ${L.name}</span><span class="sub2">${lg.dir}</span></div>
        <div class="meta">${lg.detail}</div>
      </div>`;
    }
    else if(lg.type==='ride'){
      h+=`<div class="node" style="padding-top:2px;padding-bottom:2px">
        <div class="rail" style="background:${lg.color}"></div>
        <div class="ridebar"><span class="cv">▾</span> ${lg.stops}（${lg.dur}分）</div>
      </div>`;
    }
    else if(lg.type==='alight'){const L=LINES[lg.line];
      h+=`<div class="node" style="padding-bottom:6px">
        <div class="rail" style="background:${L.color};bottom:auto;height:18px"></div>
        ${sq(lg.code,L.color)}
        <div class="row"><div class="stn">${lg.stn}</div><div class="time">${lg.time}</div></div>
        <div class="meta">出口: <span style="background:#fdd663;border-radius:3px;padding:0 6px;font-weight:700;color:#202124">${lg.exit.replace(/[^0-9]/g,'')||lg.exit}</span> ${/[^0-9]/.test(lg.exit)?lg.exit:''}</div>
      </div>`;
    }
    else if(lg.type==='dest'){
      h+=`<div class="node" style="padding-top:4px;padding-bottom:14px">
        <svg class="pin" width="26" height="34" viewBox="0 0 26 38"><path d="M13 0C5.8 0 0 5.8 0 13c0 9.6 13 25 13 25s13-15.4 13-25C26 5.8 20.2 0 13 0z" fill="#ea4335"/><circle cx="13" cy="13" r="5" fill="#fff"/></svg>
        <div class="row"><div class="stn">${lg.name}</div><div class="time">${lg.time}</div></div>
        <div class="meta">${lg.addr}</div>
      </div>`;
    }
  });
  // 料金 & カレンダー
  h+=`<div class="fare"><span>料金:</span><span class="ic">IC</span><b>${ITIN.fare}円</b></div>`;
  h+=`<div class="cal">📅 カレンダーに追加</div>`;
  el.innerHTML=h;
}

document.getElementById('totDur').textContent=ITIN.totalDur;
document.getElementById('totArr').textContent=ITIN.arrive;
renderChips();renderStatus();renderTimeline();
</script>
</body>
</html>
