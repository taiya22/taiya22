<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>終電ダッシュ経路 — 理論限界経路案内</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --g-blue:#1a73e8; --g-blue-d:#1967d2; --txt:#202124; --sub:#5f6368;
    --line:#dadce0; --go:#188038; --warn:#e37400; --ng:#d93025; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Roboto,Arial,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:var(--txt)}
  #map{position:absolute;inset:0;z-index:1;background:#e8eaed}

  /* 上部 検索バー */
  .search{position:absolute;top:10px;left:10px;right:10px;z-index:1000;
    background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.25);padding:8px 10px}
  .field{display:flex;align-items:center;gap:10px;padding:6px 4px}
  .field+.field{border-top:1px solid #eee}
  .field .ic{width:14px;height:14px;border-radius:50%;flex:0 0 auto}
  .field .ic.a{background:#fff;border:3px solid #5f6368}
  .field .ic.b{width:16px;height:16px;border-radius:0;background:transparent;
    border:0;position:relative}
  .field .ic.b::after{content:"";position:absolute;left:1px;top:-2px;width:12px;height:12px;
    background:var(--ng);border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
  .field input{border:0;outline:0;font-size:15px;width:100%;color:var(--txt);background:transparent}
  .field input::placeholder{color:#80868b}

  /* 移動手段タブ */
  .modes{position:absolute;top:96px;left:10px;right:10px;z-index:1000;display:flex;gap:8px;
    overflow-x:auto;padding:2px}
  .modes button{flex:0 0 auto;background:#fff;border:1px solid var(--line);color:var(--sub);
    border-radius:18px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;
    box-shadow:0 1px 2px rgba(0,0,0,.12);display:flex;align-items:center;gap:6px}
  .modes button.on{background:#e8f0fe;border-color:#d2e3fc;color:var(--g-blue-d)}
  .modes button .t{font-variant-numeric:tabular-nums;font-weight:700}

  /* 下部 ルートカード */
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:1000;background:#fff;
    border-radius:14px 14px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.2);
    padding:14px 16px calc(16px + env(safe-area-inset-bottom));max-height:55%;overflow:auto}
  .grab{width:34px;height:4px;background:#dadce0;border-radius:3px;margin:0 auto 12px}
  .head{display:flex;align-items:baseline;gap:10px}
  .head .time{font-size:24px;font-weight:700;color:var(--go)}
  .head .dist{font-size:14px;color:var(--sub)}
  .eta{font-size:13px;color:var(--sub);margin:2px 0 0}
  .verdict{margin:12px 0 0;border-radius:10px;padding:11px 13px;font-size:14px;font-weight:500;display:none}
  .verdict.show{display:block}
  .v-go{background:#e6f4ea;color:var(--go)}
  .v-warn{background:#fef7e0;color:var(--warn)}
  .v-ng{background:#fce8e6;color:var(--ng)}
  .when{display:flex;gap:8px;margin:12px 0 0}
  .when label{font-size:11px;color:var(--sub);display:block;margin-bottom:3px}
  .when input,.when button{font-size:14px;padding:8px 10px;border:1px solid var(--line);
    border-radius:8px;width:100%;background:#fff;color:var(--txt)}
  .when button{cursor:pointer;font-weight:500;color:var(--g-blue-d);white-space:nowrap}
  .start-btn{margin:14px 0 0;width:100%;background:var(--g-blue);color:#fff;border:0;border-radius:24px;
    padding:13px;font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;
    justify-content:center;gap:8px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .hint{font-size:11px;color:#80868b;text-align:center;margin:10px 0 0}
  .err{color:var(--ng);font-size:12px;margin-top:8px}
  .tip{background:#161b22;border:0;border-radius:6px;padding:1px 6px;font-size:12px;color:#fff}
  /* Leaflet attribution控えめ */
  .leaflet-control-attribution{font-size:9px}
</style>
</head>
<body>
<div id="map"></div>

<div class="search">
  <div class="field"><span class="ic a"></span><input id="fStart" value="現在地" placeholder="出発地"></div>
  <div class="field"><span class="ic b"></span><input id="fGoal" value="目的地（地図をタップ）" placeholder="目的地"></div>
</div>

<div class="modes" id="modes">
  <button data-m="driving" class="on">🚗 <span class="t" id="tDriving">–</span></button>
  <button data-m="foot">🚶 <span class="t" id="tFoot">–</span></button>
  <button data-m="run">🏃 <span class="t" id="tRun">–</span></button>
</div>

<div class="sheet">
  <div class="grab"></div>
  <div class="head">
    <span class="time" id="hTime">–</span>
    <span class="dist" id="hDist"></span>
  </div>
  <div class="eta" id="hEta"></div>

  <div class="verdict" id="verdict"></div>

  <div class="when">
    <div style="flex:1"><label>現在時刻</label><input type="time" id="now"></div>
    <div style="flex:1"><label>終電・目標</label><input type="time" id="last" value="23:47"></div>
    <div style="flex:0 0 auto;align-self:end"><button id="loc">📍現在地</button></div>
  </div>

  <button class="start-btn" id="start">▶ 経路をルート開始</button>
  <div class="err" id="err"></div>
  <p class="hint">ピンをドラッグ / 地図タップで目的地変更。徒歩・全力の時間は距離換算の概算です。</p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=id=>document.getElementById(id);
(function(){const d=new Date();$('now').value=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');})();

let start=[35.6938,139.7034], goal=[35.6896,139.7006], mode='driving';

const map=L.map('map',{zoomControl:false}).setView([35.6916,139.702],15);
// Google Mapに寄せた明るいタイル(CARTO Voyager)
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
  {maxZoom:20,attribution:'© OpenStreetMap © CARTO'}).addTo(map);
L.control.zoom({position:'bottomright'}).addTo(map);

function pin(kind){
  if(kind==='a') return L.divIcon({className:'',iconSize:[18,18],iconAnchor:[9,9],
    html:'<div style="width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid #5f6368;box-shadow:0 1px 3px rgba(0,0,0,.4)"></div>'});
  return L.divIcon({className:'',iconSize:[26,38],iconAnchor:[13,36],
    html:'<svg width="26" height="38" viewBox="0 0 26 38"><path d="M13 0C5.8 0 0 5.8 0 13c0 9.6 13 25 13 25s13-15.4 13-25C26 5.8 20.2 0 13 0z" fill="#ea4335"/><circle cx="13" cy="13" r="5" fill="#fff"/></svg>'});
}
const mStart=L.marker(start,{draggable:true,icon:pin('a')}).addTo(map);
const mGoal =L.marker(goal,{draggable:true,icon:pin('b')}).addTo(map);

let casing=null, line=null;
mStart.on('dragend',e=>{start=[e.target.getLatLng().lat,e.target.getLatLng().lng];$('fStart').value='選択した地点';route();});
mGoal.on('dragend', e=>{goal =[e.target.getLatLng().lat,e.target.getLatLng().lng];route();});
map.on('click',e=>{goal=[e.latlng.lat,e.latlng.lng];mGoal.setLatLng(goal);route();});

document.querySelectorAll('#modes button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#modes button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');mode=b.dataset.m;render();
}));
$('loc').addEventListener('click',()=>{
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(p=>{start=[p.coords.latitude,p.coords.longitude];
    mStart.setLatLng(start);$('fStart').value='現在地';map.setView(start,15);route();});
});
$('now').addEventListener('change',render);
$('last').addEventListener('change',render);
$('start').addEventListener('click',()=>{ if(line) map.fitBounds(line.getBounds(),{padding:[60,60]}); });

const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m;};
const fmtClock=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(Math.floor(m%60)).padStart(2,'0');};
const fmtMin=s=>{const m=Math.round(s/60);return m+'分';};
const fmtDur=s=>{const m=Math.floor(s/60),x=Math.round(s%60);return m>0?`${m}分${x>0?String(x).padStart(2,'0')+'秒':''}`:`${x}秒`;};

let R=null; // OSRM route
async function route(){
  $('err').textContent='';
  const url=`https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${goal[1]},${goal[0]}?overview=full&geometries=geojson`;
  try{
    const j=await(await fetch(url)).json();
    if(!j.routes||!j.routes.length)throw new Error('経路なし');
    R=j.routes[0]; draw(R.geometry); render();
  }catch(e){$('err').textContent='経路取得に失敗: '+e.message;}
}
function draw(geo){
  if(casing)map.removeLayer(casing); if(line)map.removeLayer(line);
  casing=L.geoJSON(geo,{style:{color:'#ffffff',weight:11,opacity:1,lineJoin:'round',lineCap:'round'}}).addTo(map);
  line  =L.geoJSON(geo,{style:{color:'#1a73e8',weight:7,opacity:1,lineJoin:'round',lineCap:'round'}}).addTo(map);
  map.fitBounds(line.getBounds(),{padding:[70,70],maxZoom:16});
}
function secFor(m){ const d=R.distance;
  if(m==='foot')return d/(5000/60);
  if(m==='run') return d/(13000/60);
  return R.duration*1.25+90;            // driving(タクシー)
}
function render(){
  if(!R)return; const d=R.distance;
  $('tDriving').textContent=fmtMin(secFor('driving'));
  $('tFoot').textContent  =fmtMin(secFor('foot'));
  $('tRun').textContent   =fmtMin(secFor('run'));

  const sec=secFor(mode);
  const now=toMin($('now').value); let last=toMin($('last').value); if(last<now)last+=1440;
  const eta=now+sec/60, slack=(last-eta)*60;

  $('hTime').textContent=fmtDur(sec);
  $('hTime').style.color = slack>=120?'#188038':slack>=0?'#e37400':'#d93025';
  $('hDist').textContent=(d>=1000?(d/1000).toFixed(1)+'km':Math.round(d)+'m');
  $('hEta').textContent=`${fmtClock(now)} 出発 → ${fmtClock(eta)} 到着予定`;

  const v=$('verdict');
  if(slack>=120){v.className='verdict show v-go';v.textContent=`✅ ${fmtClock(last)} の終電に間に合う（余裕 ${fmtDur(slack)}）`;}
  else if(slack>=0){v.className='verdict show v-warn';v.textContent=`⚠️ ギリギリ間に合う（残り ${fmtDur(slack)}）— 走れ！`;}
  else {v.className='verdict show v-ng';v.textContent=`❌ ${fmtDur(-slack)} 足りない。タクシー推奨。`;}
}
route();
</script>
</body>
</html>
